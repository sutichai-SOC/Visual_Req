// ============================================================
// LOG TIME (Jira worklog — Sub-task only)
// Lists the Sub-tasks assigned to / created by the current user, then logs
// work against the chosen one. The "Sub-task only" rule is enforced twice:
// the picker only ever shows Sub-tasks, and the backend re-checks before write.
// ============================================================
const TIME_RE = /^(\s*\d+(\.\d+)?\s*[wdhm])+\s*$/i; // Jira duration: 2h 30m / 1d / 45m
const QUICK_TIMES = ['15m', '30m', '1h', '2h', '4h', '1d'];
const WORKDAY_SECS = 8 * 3600;                 // Mon–Fri target; Sat/Sun not counted
const WD_TH = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];               // getDay(): 0=Sun..6=Sat
const MONTHS_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

// ---- date / duration helpers (Timesheet) ----
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayYmd = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isWeekend = d => { const g = d.getDay(); return g === 0 || g === 6; };
const startOfWeekMon = d => addDays(d, -((d.getDay() + 6) % 7)); // back to Monday
// seconds → "8h 30m" / "45m" / "0m"
const secsToHM = s => {
    s = Math.max(0, Math.round(s / 60) * 60);
    if (s === 0) return '0m';
    const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
    return [h ? `${h}h` : '', m ? `${m}m` : ''].filter(Boolean).join(' ') || '0m';
};

// ---- Sub-panel: the log-work form (subtask picker + duration form) ----
// Shared subtask list + form state live in the LogTimeTab container so the
// Timesheet's suggestion can prefill this form.
const LogWorkPanel = ({ settings, subtasks, loading, loadError, reload,
    selectedKey, setSelectedKey, timeSpent, setTimeSpent,
    startedDate, setStartedDate, comment, setComment, onLogged }) => {
    const [filter, setFilter] = useState('');
    const [submitting, setSubmitting] = useState(false);
    const [submitError, setSubmitError] = useState('');
    const [result, setResult] = useState(null);

    // Drill-down filter: Project → parent card → all sub-tasks under it.
    const [projects, setProjects] = useState([]);
    const [fProjectKey, setFProjectKey] = useState('');
    const [fType, setFType] = useState('');             // issue-type filter (e.g. "Test Case")
    const [typeOptions, setTypeOptions] = useState([]); // distinct types seen in the project
    const [fParents, setFParents] = useState([]);
    const [fParentsLoading, setFParentsLoading] = useState(false);
    const [fParentQuery, setFParentQuery] = useState('');
    const [fParentKey, setFParentKey] = useState('');
    const [parentSubs, setParentSubs] = useState([]);
    const [parentSubsLoading, setParentSubsLoading] = useState(false);
    const [parentSubsError, setParentSubsError] = useState('');

    useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    // Load projects once (for the filter dropdown).
    useEffect(() => {
        let cancelled = false;
        fetchJiraProjects(settings).then(l => { if (!cancelled) setProjects(l); }).catch(() => {});
        return () => { cancelled = true; };
    }, [settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);

    // Load parent cards when project / type / search changes. When no type is
    // applied, capture the distinct issue types for the Type dropdown.
    useEffect(() => {
        if (!fProjectKey) { setFParents([]); setTypeOptions([]); return; }
        let cancelled = false;
        setFParentsLoading(true);
        const t = setTimeout(() => {
            fetchParentCandidates(settings, fProjectKey, fParentQuery, fType)
                .then(l => {
                    if (cancelled) return;
                    setFParents(l);
                    if (!fType && !fParentQuery) {
                        setTypeOptions([...new Set(l.map(p => p.type).filter(Boolean))].sort());
                    }
                })
                .catch(() => { if (!cancelled) setFParents([]); })
                .finally(() => { if (!cancelled) setFParentsLoading(false); });
        }, fParentQuery ? 300 : 0);
        return () => { cancelled = true; clearTimeout(t); };
    }, [fProjectKey, fType, fParentQuery, settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);

    // Load all sub-tasks under the chosen parent.
    const loadParentSubs = React.useCallback(() => {
        if (!fParentKey) { setParentSubs([]); return; }
        let cancelled = false;
        setParentSubsLoading(true); setParentSubsError('');
        fetchSubtasksOfParent(settings, fParentKey)
            .then(l => { if (!cancelled) setParentSubs(l); })
            .catch(e => { if (!cancelled) { setParentSubs([]); setParentSubsError(e.message); } })
            .finally(() => { if (!cancelled) setParentSubsLoading(false); });
        return () => { cancelled = true; };
    }, [fParentKey, settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);
    useEffect(() => { const c = loadParentSubs(); return c; }, [loadParentSubs]);

    const clearFilter = () => { setFProjectKey(''); setFType(''); setTypeOptions([]); setFParentKey(''); setFParentQuery(''); setFParents([]); setParentSubs([]); };

    // Data source: parent-filtered list (all sub-tasks under the parent) when a
    // parent is picked; otherwise my sub-tasks, optionally narrowed by project.
    const usingParent = !!fParentKey;
    const baseList = usingParent
        ? parentSubs
        : (fProjectKey ? subtasks.filter(s => (s.key || '').startsWith(fProjectKey + '-')) : subtasks);
    const listLoading = usingParent ? parentSubsLoading : loading;

    const q = filter.trim().toLowerCase();
    const shown = !q ? baseList : baseList.filter(s =>
        (s.key || '').toLowerCase().includes(q) ||
        (s.summary || '').toLowerCase().includes(q) ||
        (s.parentKey || '').toLowerCase().includes(q) ||
        (s.parentSummary || '').toLowerCase().includes(q));
    const selected = baseList.find(s => s.key === selectedKey) || subtasks.find(s => s.key === selectedKey) || null;
    const timeValid = TIME_RE.test(timeSpent.trim());
    const canSubmit = selectedKey && timeSpent.trim() && timeValid && !submitting;

    const addQuick = (t) => {
        setTimeSpent(prev => (prev.trim() ? `${prev.trim()} ${t}` : t));
    };

    const submit = async () => {
        if (!selectedKey) { setSubmitError('เลือก Subtask ที่จะลงเวลาก่อน'); return; }
        if (!timeSpent.trim()) { setSubmitError('กรอกเวลาที่ใช้ เช่น 2h 30m'); return; }
        if (!timeValid) { setSubmitError('รูปแบบเวลาไม่ถูกต้อง — ใช้ w/d/h/m เช่น 2h 30m, 1d, 45m'); return; }
        setSubmitting(true); setSubmitError(''); setResult(null);
        try {
            const r = await logJiraWorklog(settings, {
                key: selectedKey, timeSpent: timeSpent.trim(), startedDate, comment,
            });
            setResult(r);
            setTimeSpent(''); setComment('');
            onLogged(); // refresh Σ time on the card + timesheet
        } catch (e) { setSubmitError(e.message); }
        finally { setSubmitting(false); }
    };

    return (
        <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
            {/* Left: pick a Sub-task */}
            <div className="lg:col-span-3 bg-white rounded-2xl cute-shadow p-4 border border-slate-100 flex flex-col" style={{maxHeight: 'calc(100vh - 220px)'}}>
                <div className="flex items-center justify-between mb-2">
                    <h3 className="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                        <i data-lucide="list-checks" className="w-4 h-4 text-violet-500"></i>
                        {usingParent
                            ? <>Subtask ใต้ <span className="text-violet-700">{fParentKey}</span></>
                            : <>Subtask ของฉัน <span className="text-slate-400 font-normal">(assign หรือสร้างเอง)</span></>}
                    </h3>
                    <button onClick={usingParent ? loadParentSubs : reload} disabled={listLoading}
                        className="text-xs font-medium text-violet-600 hover:text-violet-800 flex items-center gap-1 disabled:opacity-40">
                        <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 ${listLoading ? 'animate-spin' : ''}`}></i> รีเฟรช
                    </button>
                </div>

                {/* Filter: Project → parent card → all sub-tasks under it */}
                <div className="grid grid-cols-2 gap-1.5 mb-2">
                    <select value={fProjectKey} onChange={e => { setFProjectKey(e.target.value); setFType(''); setTypeOptions([]); setFParentKey(''); setFParentQuery(''); }}
                        className="text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-violet-200">
                        <option value="">ทุกโปรเจกต์ (ของฉัน)</option>
                        {projects.map(p => <option key={p.key} value={p.key}>{p.key} · {p.name}</option>)}
                    </select>
                    <select value={fType} onChange={e => { setFType(e.target.value); setFParentKey(''); }} disabled={!fProjectKey}
                        className="text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-violet-200 disabled:bg-slate-50">
                        <option value="">ทุก Type</option>
                        {typeOptions.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                    <select value={fParentKey} onChange={e => setFParentKey(e.target.value)} disabled={!fProjectKey}
                        className="col-span-2 text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-violet-200 disabled:bg-slate-50">
                        <option value="">{fParentsLoading ? 'กำลังโหลด...' : `เลือกการ์ด (${fParents.length})`}</option>
                        {fParents.map(p => <option key={p.key} value={p.key}>{p.key} · {p.summary}{p.type ? ` · ${p.type}` : ''}</option>)}
                    </select>
                    {fProjectKey && (
                        <input type="text" value={fParentQuery} onChange={e => setFParentQuery(e.target.value)}
                            placeholder="ค้นหาการ์ดแม่ (ไม่บังคับ)"
                            className="col-span-2 text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-violet-200" />
                    )}
                    {(fProjectKey || fParentKey) && (
                        <button onClick={clearFilter} className="col-span-2 text-[11px] text-slate-400 hover:text-slate-600 text-left">✕ ล้างตัวกรอง (กลับไป Subtask ของฉัน)</button>
                    )}
                </div>

                <input type="text" value={filter} onChange={e => setFilter(e.target.value)}
                    placeholder="ค้นหา key / summary / การ์ดแม่..."
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-violet-200" />
                {(loadError || parentSubsError) && <p className="text-[11px] text-rose-600 break-all bg-rose-50 border border-rose-200 rounded p-2 mb-2">{parentSubsError || loadError}</p>}
                <div className="flex-grow overflow-y-auto -mx-1 px-1 space-y-1.5">
                    {listLoading && <p className="text-[11px] text-slate-400 py-4 text-center">กำลังโหลด Subtask...</p>}
                    {!listLoading && shown.length === 0 && (
                        <p className="text-[11px] text-slate-400 py-6 text-center">
                            {baseList.length === 0
                                ? (usingParent ? 'ไม่มี Subtask ใต้การ์ดนี้' : 'ไม่พบ Subtask ที่ assign หรือสร้างโดยคุณ')
                                : 'ไม่พบผลลัพธ์ตามคำค้นหา'}
                        </p>
                    )}
                    {shown.map(s => {
                        const active = s.key === selectedKey;
                        return (
                            <button key={s.key} onClick={() => { setSelectedKey(s.key); setResult(null); setSubmitError(''); }}
                                className={`w-full text-left rounded-xl border p-2.5 transition-colors
                                    ${active ? 'border-violet-400 bg-violet-50 ring-1 ring-violet-200' : 'border-slate-150 bg-white hover:border-violet-200 hover:bg-violet-50/40'}`}>
                                <div className="flex items-center justify-between gap-2">
                                    <span className="text-xs font-bold text-violet-700">{s.key}</span>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        {s.timeSpent && <span className="text-[10px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-1.5 py-0.5">Σ {s.timeSpent}</span>}
                                        {s.status && <span className="text-[10px] text-slate-500 bg-slate-100 rounded px-1.5 py-0.5">{s.status}</span>}
                                    </div>
                                </div>
                                <p className="text-xs text-slate-700 mt-0.5 line-clamp-2">{s.summary || '(ไม่มีชื่อ)'}</p>
                                {s.parentKey && <p className="text-[10px] text-slate-400 mt-0.5 truncate">↑ {s.parentKey} · {s.parentSummary}</p>}
                            </button>
                        );
                    })}
                </div>
            </div>

            {/* Right: log time form */}
            <div className="lg:col-span-2 bg-white rounded-2xl cute-shadow p-4 border border-slate-100 flex flex-col gap-3 self-start">
                <h3 className="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                    <i data-lucide="clock" className="w-4 h-4 text-violet-500"></i> ลงเวลา (Log Work)
                </h3>

                <div className={`rounded-lg border p-2.5 text-xs ${selected ? 'border-violet-200 bg-violet-50' : 'border-dashed border-slate-200 bg-slate-50 text-slate-400'}`}>
                    {selected
                        ? <><span className="font-bold text-violet-700">{selected.key}</span> — {selected.summary}</>
                        : 'เลือก Subtask จากรายการทางซ้ายก่อน'}
                </div>

                <div>
                    <label className="block text-xs font-medium text-slate-600 mb-1">เวลาที่ใช้</label>
                    <input type="text" value={timeSpent} onChange={e => setTimeSpent(e.target.value)}
                        placeholder="เช่น 2h 30m, 1d, 45m"
                        className={`w-full text-sm border rounded-lg px-3 py-2 focus:outline-none focus:ring-2
                            ${timeSpent && !timeValid ? 'border-rose-300 focus:ring-rose-200' : 'border-slate-200 focus:ring-violet-200'}`} />
                    <div className="flex flex-wrap gap-1 mt-1.5">
                        {QUICK_TIMES.map(t => (
                            <button key={t} onClick={() => addQuick(t)}
                                className="text-[11px] font-medium text-violet-700 bg-violet-50 hover:bg-violet-100 border border-violet-200 rounded px-2 py-0.5">
                                +{t}
                            </button>
                        ))}
                        <button onClick={() => setTimeSpent('')}
                            className="text-[11px] font-medium text-slate-400 hover:text-slate-600 px-1.5 py-0.5">ล้าง</button>
                    </div>
                    {timeSpent && !timeValid && <p className="text-[11px] text-rose-500 mt-1">รูปแบบไม่ถูกต้อง — ใช้หน่วย w/d/h/m เช่น 2h 30m</p>}
                </div>

                <div>
                    <label className="block text-xs font-medium text-slate-600 mb-1">วันที่</label>
                    <input type="date" value={startedDate} onChange={e => setStartedDate(e.target.value)}
                        className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-200" />
                </div>

                <div>
                    <label className="block text-xs font-medium text-slate-600 mb-1">คำอธิบาย (ไม่บังคับ)</label>
                    <textarea value={comment} onChange={e => setComment(e.target.value)} rows={3}
                        placeholder="ทำอะไรไปบ้าง..."
                        className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-violet-200"></textarea>
                </div>

                {submitError && <p className="text-[11px] text-rose-600 break-all bg-rose-50 border border-rose-200 rounded p-2">{submitError}</p>}
                {result && (
                    <div className="text-xs bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-emerald-800">
                        ✅ ลงเวลา <b>{result.timeSpent}</b> ที่ <a href={result.url} target="_blank" className="underline font-bold">{result.key}</a> สำเร็จ
                    </div>
                )}

                <button onClick={submit} disabled={!canSubmit}
                    className={`w-full py-2.5 rounded-xl text-sm font-bold text-white transition-colors flex items-center justify-center gap-2
                        ${canSubmit ? 'bg-violet-600 hover:bg-violet-700' : 'bg-slate-300 cursor-not-allowed'}`}>
                    {submitting
                        ? <><i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i> กำลังลงเวลา...</>
                        : <><i data-lucide="check" className="w-4 h-4"></i> ลงเวลาใน Subtask</>}
                </button>
            </div>
        </div>
    );
};

// ---- Sub-panel: monthly / weekly timesheet + 8h-per-day suggestion ----
// Mon–Fri target = 8h (Sat/Sun not counted). Green = complete, red = short.
const TimesheetPanel = ({ settings, subtasks, reloadTick, onApply, onCreated }) => {
    const [mode, setMode] = useState('month');          // 'week' | 'month'
    const [refDate, setRefDate] = useState(() => new Date());
    const [data, setData] = useState({ days: {}, totalSeconds: 0 });
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');
    const [selectedDay, setSelectedDay] = useState(todayYmd);
    const [suggestCount, setSuggestCount] = useState(3);
    const [hoverDay, setHoverDay] = useState(null);     // ymd of the day whose popover is open

    // Visible range + the day cells to render.
    let rangeFrom, rangeTo, weekDays = [], monthCells = [], periodLabel = '';
    if (mode === 'week') {
        const s = startOfWeekMon(refDate);
        weekDays = Array.from({ length: 7 }, (_, i) => addDays(s, i));
        rangeFrom = ymd(weekDays[0]); rangeTo = ymd(weekDays[6]);
        periodLabel = `${weekDays[0].getDate()} ${MONTHS_TH[weekDays[0].getMonth()]} – ${weekDays[6].getDate()} ${MONTHS_TH[weekDays[6].getMonth()]} ${weekDays[6].getFullYear() + 543}`;
    } else {
        const y = refDate.getFullYear(), m = refDate.getMonth();
        const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
        const gridStart = startOfWeekMon(first);
        const rows = Math.ceil((((first.getDay() + 6) % 7) + last.getDate()) / 7);
        monthCells = Array.from({ length: rows * 7 }, (_, i) => addDays(gridStart, i));
        rangeFrom = ymd(monthCells[0]); rangeTo = ymd(monthCells[monthCells.length - 1]);
        periodLabel = `${MONTHS_TH[m]} ${y + 543}`;
    }

    const jiraOn = settings.jiraUrl && settings.jiraEmail && settings.jiraToken;
    const load = () => {
        if (!jiraOn) return;
        setLoading(true); setError('');
        fetchWorklogSummary(settings, rangeFrom, rangeTo)
            .then(r => setData(r || { days: {}, totalSeconds: 0 }))
            .catch(e => setError(e.message))
            .finally(() => setLoading(false));
    };
    useEffect(() => {
        if (!jiraOn) return;
        let cancelled = false;
        setLoading(true); setError('');
        fetchWorklogSummary(settings, rangeFrom, rangeTo)
            .then(r => { if (!cancelled) setData(r || { days: {}, totalSeconds: 0 }); })
            .catch(e => { if (!cancelled) setError(e.message); })
            .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
    }, [rangeFrom, rangeTo, reloadTick, settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    const secsOf = key => (data.days[key] && data.days[key].seconds) || 0;
    const entriesOf = key => (data.days[key] && data.days[key].entries) || [];
    const step = dir => setRefDate(d => mode === 'week'
        ? addDays(d, dir * 7)
        : new Date(d.getFullYear(), d.getMonth() + dir, 1));

    // Period totals over working days in range (skip out-of-month cells + weekends).
    const cellList = mode === 'week' ? weekDays : monthCells;
    let workTarget = 0, workLogged = 0;
    cellList.forEach(d => {
        const inScope = mode === 'week' || d.getMonth() === refDate.getMonth();
        if (inScope && !isWeekend(d)) { workTarget += WORKDAY_SECS; workLogged += secsOf(ymd(d)); }
    });
    const workRemaining = Math.max(0, workTarget - workLogged);

    const dayInfo = d => {
        const logged = secsOf(ymd(d));
        if (isWeekend(d)) return { logged, weekend: true };
        return { logged, done: logged >= WORKDAY_SECS, remaining: Math.max(0, WORKDAY_SECS - logged) };
    };

    // Suggestion for the selected day.
    const selDate = new Date(selectedDay + 'T00:00:00');
    const selTarget = isWeekend(selDate) ? 0 : WORKDAY_SECS;
    const selLogged = secsOf(selectedDay);
    const selRemaining = Math.max(0, selTarget - selLogged);
    const nCards = Math.min(Math.max(1, suggestCount), subtasks.length || 1);
    const suggestions = [];
    if (selRemaining > 0 && subtasks.length > 0) {
        const remMin = Math.round(selRemaining / 60);
        const base = Math.floor(remMin / nCards), extra = remMin - base * nCards;
        for (let i = 0; i < nCards; i++) {
            const mins = base + (i < extra ? 1 : 0);
            if (mins > 0) suggestions.push({ card: subtasks[i], timeStr: secsToHM(mins * 60) });
        }
    }
    const selLabel = `${WD_TH[selDate.getDay()]} ${selDate.getDate()} ${MONTHS_TH[selDate.getMonth()]}`;

    const dayTileClass = st => st.weekend
        ? 'border-slate-200 bg-slate-50'
        : st.done ? 'border-emerald-300 bg-emerald-50' : 'border-rose-200 bg-rose-50';

    // Hover popover: the cards logged on day `d` (pointer-events-none so it
    // never steals the mouse and flickers).
    const dayPopover = (d) => {
        const k = ymd(d), ents = entriesOf(k);
        if (hoverDay !== k || ents.length === 0) return null;
        return (
            <div className="absolute z-30 left-1/2 -translate-x-1/2 top-full mt-1 w-60 max-w-[80vw] bg-white border border-slate-200 rounded-xl shadow-xl p-2.5 text-left pointer-events-none">
                <div className="text-[10px] font-bold text-slate-500 mb-1.5 flex justify-between gap-2">
                    <span>{WD_TH[d.getDay()]} {d.getDate()} {MONTHS_TH[d.getMonth()]}</span>
                    <span className="text-slate-700">รวม {secsToHM(secsOf(k))}</span>
                </div>
                <div className="space-y-1 max-h-40 overflow-y-auto">
                    {ents.map((e, i) => (
                        <div key={e.id || i} className="flex items-center justify-between gap-2 text-[10px]">
                            <span className="font-bold text-violet-700 shrink-0">{e.key}</span>
                            <span className="text-slate-500 truncate flex-grow">{e.summary}</span>
                            {e.status && <span className="text-slate-400 shrink-0">{e.status}</span>}
                            <span className="font-medium text-slate-700 shrink-0">{e.timeSpent || secsToHM(e.timeSpentSeconds)}</span>
                        </div>
                    ))}
                </div>
            </div>
        );
    };

    return (
        <div className="space-y-4">
            {/* Toolbar */}
            <div className="bg-white rounded-2xl cute-shadow p-4 border border-slate-100">
                <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="inline-flex rounded-lg border border-slate-200 overflow-hidden text-sm">
                        <button onClick={() => setMode('week')}
                            className={`px-3 py-1.5 font-medium ${mode === 'week' ? 'bg-violet-600 text-white' : 'text-slate-600 hover:bg-slate-50'}`}>สัปดาห์</button>
                        <button onClick={() => setMode('month')}
                            className={`px-3 py-1.5 font-medium ${mode === 'month' ? 'bg-violet-600 text-white' : 'text-slate-600 hover:bg-slate-50'}`}>เดือน</button>
                    </div>
                    <div className="flex items-center gap-1.5">
                        <button onClick={() => step(-1)} className="w-7 h-7 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center"><i data-lucide="chevron-left" className="w-4 h-4"></i></button>
                        <span className="text-sm font-bold text-slate-700 min-w-[9rem] text-center">{periodLabel}</span>
                        <button onClick={() => step(1)} className="w-7 h-7 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center"><i data-lucide="chevron-right" className="w-4 h-4"></i></button>
                        <button onClick={() => { setRefDate(new Date()); setSelectedDay(todayYmd()); }}
                            className="ml-1 text-xs font-medium text-violet-600 hover:text-violet-800 px-2 py-1">วันนี้</button>
                        <button onClick={load} disabled={loading}
                            className="text-violet-600 hover:text-violet-800 disabled:opacity-40 px-1"><i data-lucide="refresh-cw" className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`}></i></button>
                    </div>
                </div>
                {/* Period summary */}
                <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs">
                    <span className="text-slate-500">รวมวันทำงาน:</span>
                    <span className="font-bold text-slate-700">ลงแล้ว {secsToHM(workLogged)}</span>
                    <span className="text-slate-400">/ เป้า {secsToHM(workTarget)}</span>
                    {workRemaining > 0
                        ? <span className="font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded px-2 py-0.5">ขาดอีก {secsToHM(workRemaining)}</span>
                        : workTarget > 0 && <span className="font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-2 py-0.5">ครบทั้งช่วง ✓</span>}
                </div>
                {error && <p className="mt-2 text-[11px] text-rose-600 break-all bg-rose-50 border border-rose-200 rounded p-2">{error}</p>}
            </div>

            {/* Calendar */}
            <div className="bg-white rounded-2xl cute-shadow p-4 border border-slate-100">
                {loading && Object.keys(data.days).length === 0 && <p className="text-[11px] text-slate-400 py-6 text-center">กำลังโหลด timesheet...</p>}
                {mode === 'week' && (
                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2">
                        {weekDays.map(d => {
                            const k = ymd(d), st = dayInfo(d), isSel = k === selectedDay, isToday = k === todayYmd();
                            const nEnt = entriesOf(k).length;
                            return (
                                <div key={k} className="relative"
                                    onMouseEnter={() => setHoverDay(k)}
                                    onMouseLeave={() => setHoverDay(h => h === k ? null : h)}>
                                    <button onClick={() => setSelectedDay(k)}
                                        className={`w-full text-left rounded-xl border p-2.5 transition-all ${dayTileClass(st)} ${isSel ? 'ring-2 ring-violet-300' : ''}`}>
                                        <div className="flex items-center justify-between">
                                            <span className="text-[11px] font-bold text-slate-600">{WD_TH[d.getDay()]} {d.getDate()}</span>
                                            {isToday && <span className="text-[9px] font-bold text-violet-600 bg-violet-100 rounded px-1">วันนี้</span>}
                                        </div>
                                        <div className="mt-1 text-sm font-bold text-slate-700">{secsToHM(st.logged)}</div>
                                        {st.weekend
                                            ? <div className="text-[10px] text-slate-400">วันหยุด</div>
                                            : st.done
                                                ? <div className="text-[10px] font-medium text-emerald-700">ครบ 8h ✓</div>
                                                : <div className="text-[10px] font-medium text-rose-600">เหลือ {secsToHM(st.remaining)}</div>}
                                        {nEnt > 0 && <div className="mt-0.5 text-[9px] text-slate-400">{nEnt} การ์ด</div>}
                                    </button>
                                    {dayPopover(d)}
                                </div>
                            );
                        })}
                    </div>
                )}
                {mode === 'month' && (
                    <div className="grid grid-cols-7 gap-1">
                        {['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'].map(w => (
                            <div key={w} className="text-center text-[10px] font-bold text-slate-400 py-1">{w}</div>
                        ))}
                        {monthCells.map(d => {
                            const k = ymd(d), inMonth = d.getMonth() === refDate.getMonth();
                            const st = dayInfo(d), isSel = k === selectedDay, isToday = k === todayYmd();
                            const nEnt = entriesOf(k).length;
                            const cls = !inMonth ? 'border-transparent bg-transparent'
                                : st.weekend ? 'border-slate-200 bg-slate-50'
                                    : st.done ? 'border-emerald-300 bg-emerald-50' : 'border-rose-200 bg-rose-50';
                            return (
                                <div key={k} className="relative"
                                    onMouseEnter={() => inMonth && setHoverDay(k)}
                                    onMouseLeave={() => setHoverDay(h => h === k ? null : h)}>
                                    <button onClick={() => inMonth && setSelectedDay(k)} disabled={!inMonth}
                                        className={`w-full aspect-square rounded-lg border p-1 flex flex-col items-center justify-center ${cls} ${isSel && inMonth ? 'ring-2 ring-violet-300' : ''}`}>
                                        <span className={`text-[11px] font-bold ${!inMonth ? 'text-slate-300' : isToday ? 'text-violet-600' : 'text-slate-600'}`}>{d.getDate()}</span>
                                        {inMonth && !st.weekend && <span className="text-[9px] text-slate-500 leading-tight">{st.logged ? secsToHM(st.logged) : '–'}</span>}
                                        {inMonth && nEnt > 0 && <span className="mt-0.5 w-1.5 h-1.5 rounded-full bg-violet-400"></span>}
                                    </button>
                                    {inMonth && dayPopover(d)}
                                </div>
                            );
                        })}
                    </div>
                )}
                <div className="mt-3 flex items-center gap-3 text-[10px] text-slate-400">
                    <span className="inline-flex items-center gap-1"><span className="w-3 h-3 rounded bg-emerald-100 border border-emerald-300"></span> ครบ 8h</span>
                    <span className="inline-flex items-center gap-1"><span className="w-3 h-3 rounded bg-rose-100 border border-rose-200"></span> ยังไม่ครบ</span>
                    <span className="inline-flex items-center gap-1"><span className="w-3 h-3 rounded bg-slate-100 border border-slate-200"></span> วันหยุด</span>
                </div>
            </div>

            {/* Entries logged on the selected day */}
            <div className="bg-white rounded-2xl cute-shadow p-4 border border-slate-100">
                <h3 className="text-sm font-bold text-slate-700 flex items-center gap-1.5 mb-2">
                    <i data-lucide="clipboard-list" className="w-4 h-4 text-violet-500"></i>
                    รายการที่ลง — {selLabel} <span className="text-slate-400 font-normal">· รวม {secsToHM(selLogged)}</span>
                </h3>
                {entriesOf(selectedDay).length === 0
                    ? <p className="text-xs text-slate-400">ยังไม่มีการลงเวลาในวันนี้ — คลิกวันอื่นในปฏิทินเพื่อดูรายการ</p>
                    : (
                        <div className="space-y-1.5">
                            {entriesOf(selectedDay).map((e, i) => (
                                <div key={e.id || i} className="flex items-center gap-2 rounded-lg border border-slate-150 p-2">
                                    <span className="text-[10px] text-slate-400 shrink-0 w-10">{(e.started || '').slice(11, 16) || '--:--'}</span>
                                    <a href={e.url} target="_blank" className="text-xs font-bold text-violet-700 shrink-0 hover:underline">{e.key}</a>
                                    <span className="text-xs text-slate-600 truncate flex-grow">{e.summary}</span>
                                    {e.status && <span className="text-[10px] text-slate-500 bg-slate-100 rounded px-1.5 py-0.5 shrink-0">{e.status}</span>}
                                    <span className="text-xs font-bold text-slate-700 shrink-0">{e.timeSpent || secsToHM(e.timeSpentSeconds)}</span>
                                </div>
                            ))}
                        </div>
                    )}
            </div>

            {/* Suggestion */}
            <div className="bg-white rounded-2xl cute-shadow p-4 border border-slate-100">
                <h3 className="text-sm font-bold text-slate-700 flex items-center gap-1.5 mb-2">
                    <i data-lucide="lightbulb" className="w-4 h-4 text-amber-500"></i> ตัวช่วยลงเวลา — {selLabel}
                </h3>
                <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs mb-3">
                    <span className="text-slate-500">ลงแล้ว <b className="text-slate-700">{secsToHM(selLogged)}</b></span>
                    <span className="text-slate-400">/ เป้า {selTarget ? secsToHM(selTarget) : 'ไม่นับ (วันหยุด)'}</span>
                    {selTarget > 0 && (selRemaining > 0
                        ? <span className="font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded px-2 py-0.5">เหลือ {secsToHM(selRemaining)}</span>
                        : <span className="font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-2 py-0.5">ครบ 8h แล้ว 🎉</span>)}
                </div>

                {selTarget === 0 && <p className="text-xs text-slate-400">เป็นวันหยุด — ไม่ต้องลงเวลา</p>}
                {selTarget > 0 && selRemaining <= 0 && <p className="text-xs text-emerald-700">ลงเวลาครบแล้วสำหรับวันนี้ 👍</p>}
                {selTarget > 0 && selRemaining > 0 && (
                    <>
                        {subtasks.length === 0
                            ? <p className="text-xs text-slate-400">ยังไม่มีการ์ด (Subtask) ให้แนะนำ — เพิ่ม/รีเฟรชที่แท็บ “ลงเวลา”</p>
                            : (
                                <>
                                    <div className="flex items-center gap-2 text-xs mb-2">
                                        <span className="text-slate-500">เฉลี่ยเวลาที่เหลือใส่</span>
                                        <input type="number" min="1" max="8" value={suggestCount}
                                            onChange={e => setSuggestCount(Math.max(1, Math.min(8, parseInt(e.target.value) || 1)))}
                                            className="w-14 border border-slate-200 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-violet-200" />
                                        <span className="text-slate-500">การ์ด</span>
                                    </div>
                                    <div className="space-y-1.5">
                                        {suggestions.map(({ card, timeStr }) => (
                                            <div key={card.key} className="flex items-center gap-2 rounded-lg border border-slate-150 p-2">
                                                <div className="min-w-0 flex-grow">
                                                    <span className="text-xs font-bold text-violet-700">{card.key}</span>
                                                    <span className="text-xs text-slate-600 ml-1.5 truncate">{card.summary}</span>
                                                </div>
                                                <span className="text-xs font-bold text-slate-700 shrink-0">{timeStr}</span>
                                                <button onClick={() => onApply(card.key, timeStr, selectedDay)}
                                                    className="shrink-0 text-[11px] font-bold text-white bg-violet-600 hover:bg-violet-700 rounded px-2.5 py-1">ใช้</button>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}
                    </>
                )}
                <p className="mt-3 text-[10px] text-slate-400">เป็นเพียงคำแนะนำ — กด “ใช้” เพื่อเติมฟอร์มในแท็บลงเวลา แล้วกดยืนยันเอง (ระบบไม่ลงเวลาให้อัตโนมัติ)</p>
            </div>

            {/* Create a Sub-task + log time — merged into the timesheet; the date
                follows the day selected in the calendar above. */}
            <div className="pt-1">
                <div className="flex items-center gap-2 mb-2">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">เพิ่มงานใหม่</span>
                    <span className="flex-grow border-t border-slate-200"></span>
                </div>
                <CreateSubtaskPanel settings={settings} defaultDate={selectedDay} onCreated={onCreated} />
            </div>
        </div>
    );
};

// ---- Sub-panel: create a Sub-task under a category card + log time in one go ----
// Parent = a non-subtask "category" card (Leave, Admin, Training...). The new
// Sub-task is auto-assigned to the current user and set Non-Billable.
const CreateSubtaskPanel = ({ settings, onCreated, defaultDate }) => {
    const [projects, setProjects] = useState([]);
    const [projectsError, setProjectsError] = useState('');
    const [projectKey, setProjectKey] = useState('');

    const [parents, setParents] = useState([]);
    const [parentsLoading, setParentsLoading] = useState(false);
    const [parentsError, setParentsError] = useState('');
    const [parentKey, setParentKey] = useState('');
    const [parentQuery, setParentQuery] = useState('');
    const [manualKey, setManualKey] = useState('');     // fallback: type a parent key directly

    const [summary, setSummary] = useState('');
    const [assignToMe, setAssignToMe] = useState(true);
    const [statuses, setStatuses] = useState([]);
    const [targetStatus, setTargetStatus] = useState('');   // '' = ค่าเริ่มต้นของ workflow
    const [timeSpent, setTimeSpent] = useState('');
    const [startedDate, setStartedDate] = useState(() => defaultDate || todayYmd());
    const [comment, setComment] = useState('');

    // Follow the day selected in the calendar above.
    useEffect(() => { if (defaultDate) setStartedDate(defaultDate); }, [defaultDate]);

    const [submitting, setSubmitting] = useState(false);
    const [submitError, setSubmitError] = useState('');
    const [result, setResult] = useState(null);

    useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    // Load projects once.
    useEffect(() => {
        let cancelled = false;
        fetchJiraProjects(settings)
            .then(list => { if (!cancelled) setProjects(list); })
            .catch(e => { if (!cancelled) setProjectsError(e.message); });
        return () => { cancelled = true; };
    }, [settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);

    // Load the Sub-task statuses for the chosen project (for the Status picker).
    useEffect(() => {
        setTargetStatus('');
        if (!projectKey) { setStatuses([]); return; }
        let cancelled = false;
        fetchSubtaskStatuses(settings, projectKey)
            .then(l => { if (!cancelled) setStatuses(l); })
            .catch(() => { if (!cancelled) setStatuses([]); });
        return () => { cancelled = true; };
    }, [projectKey, settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);

    // Load parent cards when project (or search) changes.
    useEffect(() => {
        if (!projectKey) { setParents([]); setParentsError(''); return; }
        let cancelled = false;
        setParentsLoading(true); setParentsError('');
        const t = setTimeout(() => {
            fetchParentCandidates(settings, projectKey, parentQuery)
                .then(list => { if (!cancelled) setParents(list); })
                .catch(e => { if (!cancelled) { setParents([]); setParentsError(e.message); } })
                .finally(() => { if (!cancelled) setParentsLoading(false); });
        }, parentQuery ? 300 : 0);
        return () => { cancelled = true; clearTimeout(t); };
    }, [projectKey, parentQuery, settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);

    const parent = manualKey.trim() || parentKey;   // manual key wins over the dropdown
    const timeFormatOk = !timeSpent.trim() || TIME_RE.test(timeSpent.trim());  // format only
    const canSubmit = projectKey && parent && summary.trim() && timeSpent.trim() && timeFormatOk && !submitting;
    const addQuick = t => setTimeSpent(prev => (prev.trim() ? `${prev.trim()} ${t}` : t));

    const submit = async () => {
        if (!projectKey) { setSubmitError('เลือกโปรเจกต์ก่อน'); return; }
        if (!parent) { setSubmitError('เลือกหรือพิมพ์การ์ดแม่/หมวดงานก่อน'); return; }
        if (!summary.trim()) { setSubmitError('ตั้งชื่อ Subtask ก่อน'); return; }
        if (!timeSpent.trim()) { setSubmitError('กรอกเวลาที่ใช้ก่อน เช่น 2h 30m'); return; }
        if (!timeFormatOk) { setSubmitError('รูปแบบเวลาไม่ถูกต้อง — เช่น 2h 30m'); return; }
        setSubmitting(true); setSubmitError(''); setResult(null);
        try {
            const sub = await createJiraSubtask(settings, {
                projectKey, parentKey: parent, summary: summary.trim(),
                assignToMe, billType: 'Non-Billable', targetStatus,
            });
            let logged = null;
            if (timeSpent.trim()) {
                logged = await logJiraWorklog(settings, {
                    key: sub.key, timeSpent: timeSpent.trim(), startedDate, comment,
                });
            }
            setResult({ ...sub, logged, requestedStatus: targetStatus });
            setSummary(''); setTimeSpent(''); setComment('');
            onCreated && onCreated();
        } catch (e) { setSubmitError(e.message); }
        finally { setSubmitting(false); }
    };

    const selectedParent = parents.find(p => p.key === parentKey);

    return (
        <div className="max-w-2xl mx-auto bg-white rounded-2xl cute-shadow p-5 border border-slate-100 flex flex-col gap-3">
            <h3 className="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                <i data-lucide="folder-plus" className="w-4 h-4 text-violet-500"></i> สร้าง Subtask + ลงเวลา
            </h3>
            {projectsError && <p className="text-[11px] text-rose-600 break-all bg-rose-50 border border-rose-200 rounded p-2">{projectsError}</p>}

            <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">โปรเจกต์</label>
                <select value={projectKey} onChange={e => { setProjectKey(e.target.value); setParentKey(''); setParentQuery(''); }}
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-violet-200">
                    <option value="">— เลือกโปรเจกต์ —</option>
                    {projects.map(p => <option key={p.key} value={p.key}>{p.key} · {p.name}</option>)}
                </select>
            </div>

            <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">ประเภทการ์ด (การ์ดแม่ / หมวดงาน)</label>
                <input type="text" value={parentQuery} onChange={e => setParentQuery(e.target.value)}
                    disabled={!projectKey} placeholder={projectKey ? 'ค้นหา (ไม่บังคับ) — เว้นว่างเพื่อแสดงทั้งหมด' : 'เลือกโปรเจกต์ก่อน'}
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 mb-1.5 focus:outline-none focus:ring-2 focus:ring-violet-200 disabled:bg-slate-50" />
                <select value={parentKey} onChange={e => { setParentKey(e.target.value); setManualKey(''); }} disabled={!projectKey}
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-violet-200 disabled:bg-slate-50">
                    <option value="">{parentsLoading ? 'กำลังโหลด...' : `— เลือกการ์ดแม่ (${parents.length}) —`}</option>
                    {parents.map(p => <option key={p.key} value={p.key}>{p.key} · {p.summary}</option>)}
                </select>
                {selectedParent && !manualKey.trim() && <p className="text-[10px] text-slate-400 mt-1">↑ {selectedParent.type} · {selectedParent.status}</p>}
                {parentsError && <p className="text-[11px] text-rose-600 break-all bg-rose-50 border border-rose-200 rounded p-2 mt-1.5">ดึงการ์ดแม่ไม่สำเร็จ: {parentsError}</p>}
                {projectKey && !parentsLoading && !parentsError && parents.length === 0 &&
                    <p className="text-[11px] text-amber-600 mt-1.5">ไม่พบการ์ดในโปรเจกต์นี้ — ลองพิมพ์ Parent key เองด้านล่าง</p>}
                <input type="text" value={manualKey} onChange={e => setManualKey(e.target.value)} disabled={!projectKey}
                    placeholder="หรือพิมพ์ Parent key เอง (เช่น SWO-2)"
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 mt-1.5 focus:outline-none focus:ring-2 focus:ring-violet-200 disabled:bg-slate-50" />
                {manualKey.trim() && <p className="text-[10px] text-violet-500 mt-1">จะสร้างใต้: <b>{manualKey.trim()}</b></p>}
            </div>

            <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">ชื่อ Subtask</label>
                <input type="text" value={summary} onChange={e => setSummary(e.target.value)}
                    placeholder="เช่น ลาพักร้อน 30 ก.ค."
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-200" />
            </div>

            <div className="flex flex-wrap items-center gap-3 text-xs">
                <label className="inline-flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" checked={assignToMe} onChange={e => setAssignToMe(e.target.checked)} className="accent-violet-600" />
                    <span className="text-slate-600">Assign ให้ฉัน</span>
                </label>
                <span className="inline-flex items-center gap-1 text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-2 py-0.5 font-medium">Bill Type: Non-Billable</span>
            </div>

            <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Status <span className="text-slate-400 font-normal">(ไม่บังคับ)</span></label>
                <select value={targetStatus} onChange={e => setTargetStatus(e.target.value)} disabled={!projectKey || statuses.length === 0}
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-violet-200 disabled:bg-slate-50">
                    <option value="">ค่าเริ่มต้น (ตาม workflow)</option>
                    {statuses.map(s => <option key={s.id || s.name} value={s.name}>{s.name}</option>)}
                </select>
            </div>

            <div className="border-t border-slate-100 pt-3">
                <label className="block text-xs font-medium text-slate-600 mb-1">เวลาที่ใช้ <span className="text-rose-500">*</span></label>
                <input type="text" value={timeSpent} onChange={e => setTimeSpent(e.target.value)}
                    placeholder="เช่น 2h 30m, 1d, 45m"
                    className={`w-full text-sm border rounded-lg px-3 py-2 focus:outline-none focus:ring-2
                        ${timeSpent && !timeFormatOk ? 'border-rose-300 focus:ring-rose-200' : 'border-slate-200 focus:ring-violet-200'}`} />
                <div className="flex flex-wrap gap-1 mt-1.5">
                    {QUICK_TIMES.map(t => (
                        <button key={t} onClick={() => addQuick(t)}
                            className="text-[11px] font-medium text-violet-700 bg-violet-50 hover:bg-violet-100 border border-violet-200 rounded px-2 py-0.5">+{t}</button>
                    ))}
                    <button onClick={() => setTimeSpent('')} className="text-[11px] font-medium text-slate-400 hover:text-slate-600 px-1.5 py-0.5">ล้าง</button>
                </div>
                {timeSpent && !timeFormatOk && <p className="text-[11px] text-rose-500 mt-1">รูปแบบไม่ถูกต้อง — ใช้หน่วย w/d/h/m เช่น 2h 30m</p>}
            </div>

            <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">วันที่</label>
                <input type="date" value={startedDate} onChange={e => setStartedDate(e.target.value)}
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-200" />
            </div>

            <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">คำอธิบาย (ไม่บังคับ)</label>
                <textarea value={comment} onChange={e => setComment(e.target.value)} rows={2}
                    placeholder="ทำอะไรไปบ้าง..."
                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-violet-200"></textarea>
            </div>

            {submitError && <p className="text-[11px] text-rose-600 break-all bg-rose-50 border border-rose-200 rounded p-2">{submitError}</p>}
            {result && (
                <div className="text-xs bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-emerald-800">
                    ✅ สร้าง <a href={result.url} target="_blank" className="underline font-bold">{result.key}</a> สำเร็จ
                    {result.logged ? <> · ลงเวลา <b>{result.logged.timeSpent}</b> แล้ว</> : <> (ยังไม่ได้ลงเวลา)</>}
                    {result.status
                        ? <> · สถานะ <b>{result.status}</b></>
                        : (result.requestedStatus && <> · <span className="text-amber-600">เปลี่ยนสถานะเป็น {result.requestedStatus} ไม่ได้ (workflow ไม่อนุญาตในขั้นเดียว)</span></>)}
                </div>
            )}

            <button onClick={submit} disabled={!canSubmit}
                className={`w-full py-2.5 rounded-xl text-sm font-bold text-white transition-colors flex items-center justify-center gap-2
                    ${canSubmit ? 'bg-violet-600 hover:bg-violet-700' : 'bg-slate-300 cursor-not-allowed'}`}>
                {submitting
                    ? <><i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i> กำลังสร้าง...</>
                    : <><i data-lucide="plus" className="w-4 h-4"></i> สร้าง Subtask + ลงเวลา</>}
            </button>
        </div>
    );
};

// ---- Container: tab switch + shared subtask/form state ----
const LogTimeTab = ({ settings, view = 'log', onGoToLog }) => {
    const jiraOn = settings.jiraUrl && settings.jiraEmail && settings.jiraToken;
    const [subtasks, setSubtasks] = useState([]);
    const [subLoading, setSubLoading] = useState(false);
    const [subError, setSubError] = useState('');
    const [selectedKey, setSelectedKey] = useState('');
    const [timeSpent, setTimeSpent] = useState('');
    const [startedDate, setStartedDate] = useState(todayYmd);
    const [comment, setComment] = useState('');
    const [reloadTick, setReloadTick] = useState(0);    // bump → timesheet refetches

    const loadSubtasks = React.useCallback(() => {
        if (!jiraOn) return;
        let cancelled = false;
        setSubLoading(true); setSubError('');
        fetchMySubtasks(settings)
            .then(l => { if (!cancelled) setSubtasks(l); })
            .catch(e => { if (!cancelled) setSubError(e.message); })
            .finally(() => { if (!cancelled) setSubLoading(false); });
        return () => { cancelled = true; };
    }, [jiraOn, settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);
    useEffect(() => { const c = loadSubtasks(); return c; }, [loadSubtasks]);
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    const applySuggestion = (key, timeStr, date) => {
        setSelectedKey(key); setTimeSpent(timeStr); if (date) setStartedDate(date);
        onGoToLog && onGoToLog();   // jump to the Log Time tab with the form prefilled
    };

    if (!jiraOn) {
        return (
            <div className="bg-white rounded-2xl border border-dashed border-slate-200 p-12 text-center text-slate-400">
                <div className="text-4xl mb-3">⏱️</div>
                <p className="text-sm">ยังไม่ได้ตั้งค่า Jira — เปิด ⚙️ Settings แล้วกรอก Base URL, Email และ API Token ก่อนใช้งาน</p>
            </div>
        );
    }

    return (
        <div className="space-y-4">
            {view === 'log' &&
                <LogWorkPanel settings={settings} subtasks={subtasks} loading={subLoading} loadError={subError} reload={loadSubtasks}
                    selectedKey={selectedKey} setSelectedKey={setSelectedKey} timeSpent={timeSpent} setTimeSpent={setTimeSpent}
                    startedDate={startedDate} setStartedDate={setStartedDate} comment={comment} setComment={setComment}
                    onLogged={() => { loadSubtasks(); setReloadTick(t => t + 1); }} />}
            {view === 'timesheet' &&
                <TimesheetPanel settings={settings} subtasks={subtasks} reloadTick={reloadTick} onApply={applySuggestion}
                    onCreated={() => { loadSubtasks(); setReloadTick(t => t + 1); }} />}
        </div>
    );
};

// ============================================================
// MAIN APP
// ============================================================
const App = () => {
    const [mainTab, setMainTab] = useState('new');
    const [inputText, setInputText] = useState('');
    const [isGenerating, setIsGenerating] = useState(false);
    const [parsedData, setParsedData] = useState(null);
    const [activeSubTabNew, setActiveSubTabNew] = useState('visual');
    const [isGeneratingUpdate, setIsGeneratingUpdate] = useState(false);
    const [hasResultUpdate, setHasResultUpdate] = useState(false);
    const [activeSubTabUpdate, setActiveSubTabUpdate] = useState('diff');
    const [showNotification, setShowNotification] = useState(true);
    const [errorMsg, setErrorMsg] = useState('');

    // AI settings
    const [settings, setSettings] = useState(loadSettings);
    const [showSettings, setShowSettings] = useState(false);
    const [updateError, setUpdateError] = useState('');
    const [aiError, setAiError] = useState('');     // persistent AI error banner (new-test flow)
    const [retryMsg, setRetryMsg] = useState('');   // "retrying..." status during backoff
    const [impactData, setImpactData] = useState(null); // AI impact result, null = use mock
    const [history, setHistory] = useState(loadHistory);

    const [showInputModal, setShowInputModal] = useState(false); // expand requirement editor

    // What to generate (toggle off to save tokens). Both default ON; at least one must stay ON.
    const [genVisualMap, setGenVisualMap] = useState(() => {
        try { const v = JSON.parse(localStorage.getItem('visualreq_genopts') || '{}').visualMap; return v !== false; } catch (e) { return true; }
    });
    const [genTestCases, setGenTestCases] = useState(() => {
        try { const v = JSON.parse(localStorage.getItem('visualreq_genopts') || '{}').testCases; return v !== false; } catch (e) { return true; }
    });
    const saveGenOpts = (vm, tc) => localStorage.setItem('visualreq_genopts', JSON.stringify({ visualMap: vm, testCases: tc }));
    const toggleGen = (which) => {
        if (which === 'map') {
            const next = !genVisualMap;
            if (!next && !genTestCases) return; // keep at least one on
            setGenVisualMap(next); saveGenOpts(next, genTestCases);
        } else {
            const next = !genTestCases;
            if (!next && !genVisualMap) return;
            setGenTestCases(next); saveGenOpts(genVisualMap, next);
        }
    };

    // Jira import
    const [jiraInput, setJiraInput] = useState('');
    const [jiraLoading, setJiraLoading] = useState(false);
    const [jiraError, setJiraError] = useState('');
    const [jiraMeta, setJiraMeta] = useState(null); // {key, status, url} of last fetched

    // Requirement Tracking
    const [tracked, setTracked] = useState(loadTracked);
    const [trackInput, setTrackInput] = useState('');
    const [trackAdding, setTrackAdding] = useState(false);
    const [trackChecking, setTrackChecking] = useState(false);
    const [trackError, setTrackError] = useState('');
    const [trackExpanded, setTrackExpanded] = useState(null); // id of card showing diff
    const [trackSuggest, setTrackSuggest] = useState([]);
    const [trackSuggestLoading, setTrackSuggestLoading] = useState(false);
    const [trackSuggestOpen, setTrackSuggestOpen] = useState(false);
    const lastCheckRef = React.useRef(0);
    const trackedRef = React.useRef(tracked);    // latest list for the poll timer
    React.useEffect(() => { trackedRef.current = tracked; }, [tracked]);

    // Auto-poll config (persisted separately so the Tracking toolbar can toggle it)
    const [autoPoll, setAutoPoll] = useState(() => {
        try { return JSON.parse(localStorage.getItem('visualreq_poll') || '{}').enabled || false; } catch (e) { return false; }
    });
    const [pollMinutes, setPollMinutes] = useState(() => {
        try { return JSON.parse(localStorage.getItem('visualreq_poll') || '{}').minutes || 5; } catch (e) { return 5; }
    });
    const savePollCfg = (enabled, minutes) => localStorage.setItem('visualreq_poll', JSON.stringify({ enabled, minutes }));

    const aiOn = settings.enabled && settings.apiKey;
    const jiraOn = settings.jiraUrl && settings.jiraEmail && settings.jiraToken;
    const changedCount = tracked.filter(t => t.changed).length;

    const persistTracked = (updater) => setTracked(prev => {
        const next = typeof updater === 'function' ? updater(prev) : updater;
        writeTracked(next);
        return next;
    });

    const addTrackedKey = async (keyOrLink) => {
        if (!keyOrLink || !keyOrLink.trim()) return;
        if (!jiraOn) { setTrackError('ยังไม่ได้ตั้งค่า Jira — เปิด ⚙️ Settings ก่อน'); return; }
        setTrackAdding(true); setTrackError('');
        setTrackSuggestOpen(false);
        try {
            const issue = await fetchJiraIssue(keyOrLink, settings);
            if (tracked.some(t => t.key === issue.key)) {
                setTrackError(`${issue.key} ถูกติดตามอยู่แล้ว`);
            } else {
                persistTracked(list => [{
                    id: String(Date.now()),
                    key: issue.key, summary: issue.summary, status: issue.status, url: issue.url,
                    updatedAt: issue.updated, snapshot: issue.requirement, current: issue.requirement,
                    changed: false, lastChecked: Date.now(),
                }, ...list]);
                setTrackInput('');
                setTrackSuggest([]);
            }
        } catch (e) { setTrackError(e.message); }
        finally { setTrackAdding(false); }
    };
    const handleAddTracked = () => addTrackedKey(trackInput);

    const removeTracked = (id, e) => { if (e) e.stopPropagation(); persistTracked(list => list.filter(t => t.id !== id)); };
    const acknowledgeTracked = (id, e) => {
        if (e) e.stopPropagation();
        persistTracked(list => list.map(t => t.id === id ? { ...t, snapshot: t.current, changed: false } : t));
        setTrackExpanded(null);
    };
    // Wand button on a tracked card → open Impact tab and analyze the change.
    // Passes OLD + NEW so the AI computes a real diff-based impact; keeps the NEW
    // version in the input box so the user can later "Gen Qase TC" from it.
    const analyzeFromTracked = (t, e) => {
        if (e) e.stopPropagation();
        const text = (t.changed && t.snapshot && t.snapshot !== t.current)
            ? `[Requirement เดิม / OLD VERSION]\n${t.snapshot}\n\n---\n\n[Requirement ใหม่ / NEW VERSION (ปัจจุบัน)]\n${t.current}`
            : t.current;
        setInputText(t.current);
        setJiraMeta({ key: t.key, status: t.status, url: t.url, summary: t.summary });
        setMainTab('update');
        handleAnalyzeUpdate(text);
    };

    // 2-phase poll: (1) one bulk call checks `updated` timestamps for ALL issues;
    // (2) fetch full content ONLY for issues whose timestamp changed. Scales to 100+.
    const checkAllTracked = async () => {
        const list = trackedRef.current;
        if (!jiraOn || trackChecking || !list.length) return;
        setTrackChecking(true); setTrackError('');
        lastCheckRef.current = Date.now();
        const now = Date.now();
        try {
            // Phase 1 — bulk timestamp/summary/status (1 request per 50 keys)
            let bulk = {};
            try {
                bulk = await fetchJiraBulk(list.map(t => t.key), settings);
            } catch (e) {
                setTrackError('ตรวจสอบไม่สำเร็จ: ' + e.message);
                setTrackChecking(false);
                return;
            }
            // Decide which need a full content fetch (timestamp moved vs stored)
            const needFull = list.filter(t => bulk[t.key] && bulk[t.key].updated && bulk[t.key].updated !== t.updatedAt);

            // Phase 2 — full fetch only for changed issues, max 6 concurrent
            const fullMap = {};
            await runLimited(needFull, 6, async (t) => {
                try { fullMap[t.key] = await fetchJiraIssue(t.key, settings); }
                catch (e) { fullMap[t.key] = { _error: e.message }; }
            });

            persistTracked(prev => prev.map(t => {
                const b = bulk[t.key];
                if (!b) return { ...t, lastChecked: now, checkError: 'ไม่พบใน Jira (อาจถูกลบ/ไม่มีสิทธิ์)' };
                const full = fullMap[t.key];
                if (full && !full._error) {
                    const changed = (full.requirement || '').trim() !== (t.snapshot || '').trim();
                    return { ...t, summary: full.summary, status: full.status, url: full.url,
                             updatedAt: full.updated, current: full.requirement, changed,
                             lastChecked: now, checkError: undefined };
                }
                // No content change needed — just refresh cheap fields
                return { ...t, summary: b.summary || t.summary, status: b.status || t.status,
                         lastChecked: now, checkError: full && full._error ? full._error : undefined };
            }));
        } finally { setTrackChecking(false); }
    };

    // Auto-check when entering the Tracking tab (debounced to once / 2 min)
    useEffect(() => {
        if (mainTab === 'track' && jiraOn && tracked.length && Date.now() - lastCheckRef.current > 120000) {
            checkAllTracked();
        }
    }, [mainTab]);

    // Background auto-poll on a timer (runs even from other tabs so the badge alerts)
    useEffect(() => {
        if (!autoPoll || !jiraOn || !tracked.length) return;
        const ms = Math.max(1, pollMinutes) * 60000;
        const id = setInterval(() => { checkAllTracked(); }, ms);
        return () => clearInterval(id);
    }, [autoPoll, pollMinutes, jiraOn, tracked.length]);

    // Debounced auto-suggest search for the Tracking add box
    useEffect(() => {
        const q = trackInput.trim();
        if (mainTab !== 'track' || !jiraOn || q.length < 2 || q.includes('://')) {
            setTrackSuggest([]); setTrackSuggestLoading(false);
            return;
        }
        setTrackSuggestLoading(true);
        const id = setTimeout(async () => {
            try {
                const results = await fetchJiraSearch(q, settings);
                setTrackSuggest(results);
                setTrackSuggestOpen(true);
            } catch (e) {
                setTrackSuggest([]);
            } finally {
                setTrackSuggestLoading(false);
            }
        }, 350);
        return () => clearTimeout(id);

    const handleFetchJira = async () => {

            setJiraError('ยังไม่ได้ตั้งค่า Jira — เปิด ⚙️ Settings กรอก Base URL, Email, Token');

            setJiraMeta({ key: issue.key, status: issue.status, url: issue.url, summary: issue.summary });
        } catch (e) {
            setJiraError(e.message);
        } finally {
            setJiraLoading(false);
        }
    };

    const saveToHistory = (parsed) => {
        setHistory(h => addHistory(h, { inputText, parsed, mode: aiOn ? settings.provider : 'offline' }));
    };
    const openHistory = (item) => {

    const deleteHistory = (id, e) => {
        e.stopPropagation();
        setHistory(h => { const next = h.filter(x => x.id !== id); writeHistory(next); return next; });
    };
    const clearHistory = () => {
        if (window.confirm('ลบประวัติทั้งหมด?')) { writeHistory([]); setHistory([]); }
    };

    useEffect(() => {
        if (window.lucide) setTimeout(() => window.lucide.createIcons(), 50);
    }, [mainTab, activeSubTabNew, activeSubTabUpdate, hasResultUpdate, parsedData, history, jiraLoading, jiraMeta, jiraError, showInputModal, tracked, trackExpanded, trackChecking, trackAdding, autoPoll, pollMinutes, genVisualMap, genTestCases]);

    const handleGenerate = async () => {
        if (!inputText.trim()) {
            setErrorMsg('กรุณาใส่ Requirement ก่อนกด Generate นะครับ! ✨');
            setTimeout(() => setErrorMsg(''), 3000);
            return;
        }
        setIsGenerating(true);
        setParsedData(null);
        setAiError('');
        setRetryMsg('');

        const opts = { visualMap: genVisualMap, testCases: genTestCases };
        const firstTab = genVisualMap ? 'visual' : 'json';
        // Stamp flags + blank the parts that were turned off (covers offline; AI already omits them).
        const applyGenOpts = (r) => {
            r.mapOn = genVisualMap;
            r.tcOn = genTestCases;
            if (!genVisualMap) { r.preConditions = []; r.postConditions = []; r.rawSentences = []; r.scenarios = []; r.acceptanceCriteria = []; }
            if (!genTestCases) { r.testCases = []; }
            return r;
        };

        if (aiOn) {
            const onRetry = (n, total, secs) =>
                setRetryMsg(`AI กำลังโหลดหนัก — ลองใหม่ครั้งที่ ${n}/${total} ใน ${secs} วิ...`);
            try {
                const result = applyGenOpts(await aiGenerateTestCases(inputText, settings, onRetry, opts));
                setParsedData(result);
                saveToHistory(result);
                setActiveSubTabNew(firstTab);
            } catch (e) {
                setAiError(e.message); // persistent banner — don't hide the reason
                const fallback = applyGenOpts(parseRequirement(inputText)); // graceful fallback to offline
                setParsedData(fallback);
                saveToHistory(fallback);
                setActiveSubTabNew(firstTab);
            } finally {
                setIsGenerating(false);
                setRetryMsg('');
            }
            return;
        }

        // Offline rule-based parser
        setTimeout(() => {
            const result = applyGenOpts(parseRequirement(inputText));
            setParsedData(result);
            saveToHistory(result);
            setIsGenerating(false);
            setActiveSubTabNew(firstTab);
        }, 1200);
    };

    const handleKeyDown = (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') handleGenerate();
    };

    const handleReset = () => {
        setParsedData(null);
        setInputText('');
    };

    const handleAnalyzeUpdate = async (overrideText) => {
        const text = typeof overrideText === 'string' ? overrideText : inputText;
        setIsGeneratingUpdate(true);
        setHasResultUpdate(false);
        setUpdateError('');
        setRetryMsg('');

        if (aiOn && text.trim()) {
            const onRetry = (n, total, secs) =>
                setRetryMsg(`AI กำลังโหลดหนัก — ลองใหม่ครั้งที่ ${n}/${total} ใน ${secs} วิ...`);
            try {
                const result = await aiImpactAnalysis(text, settings, onRetry);
                setImpactData(result);
                setHasResultUpdate(true);
                setShowNotification(false);
                setActiveSubTabUpdate('impact');

                setUpdateError('AI error: ' + e.message + ' — แสดงตัวอย่าง (demo) แทน');
                setImpactData(null);
                setHasResultUpdate(true);
                setShowNotification(false);
            } finally {
                setIsGeneratingUpdate(false);
                setRetryMsg('');
            }
            return;
        }

        // Demo / offline mode
        setImpactData(null);
        setTimeout(() => {
            setIsGeneratingUpdate(false);
            setHasResultUpdate(true);
            setShowNotification(false);

                            <div className="bg-gradient-to-tr from-teal-400 to-sky-400 text-white p-2.5 rounded-xl shadow-lg">
                                <i data-lucide="wand-2" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-extrabold text-slate-800 tracking-tight">
                                    Visual<span className="text-teal-500">Req</span>
                                    <span className="ml-2 text-xs font-bold bg-teal-100 text-teal-700 px-2 py-0.5 rounded-full align-middle">v2</span>
                                </h1>
                                <p className="text-[10px] font-medium text-slate-500 uppercase tracking-widest hidden sm:block">1 รูปจบ ครบทุก Requirement</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className={`hidden md:flex rounded-full px-4 py-1.5 text-xs font-medium border items-center gap-2 ${aiOn ? 'bg-teal-50 text-teal-700 border-teal-200' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                                <div className={`w-2 h-2 rounded-full animate-pulse ${aiOn ? 'bg-teal-500' : 'bg-amber-400'}`}></div>
                                {aiOn ? `AI: ${AI_DEFAULTS[settings.provider]?.label || settings.provider}` : 'Offline Mode'}

                                className="bg-slate-800 hover:bg-slate-700 text-white p-2 rounded-full transition-colors" title="AI Settings">
                                <i data-lucide="settings" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div className="bg-slate-50 border-t border-slate-200">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-6">

                                ${mainTab === 'new' ? 'border-teal-500 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>

            {showInputModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 sm:p-8" onClick={() => setShowInputModal(false)}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl h-[85vh] flex flex-col border border-slate-200" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between p-5 border-b border-slate-100 shrink-0">

                        <div className="flex-grow p-5 min-h-0">
                            <textarea
                                className="w-full h-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-teal-500/20 focus:border-teal-400 transition-all resize-none text-sm text-slate-700 leading-relaxed"
                                value={inputText}
                                onChange={e => setInputText(e.target.value)}
                                placeholder="Requirement..."
                            />
                        </div>
                        <div className="flex items-center justify-between gap-3 p-5 border-t border-slate-100 shrink-0">
                            <span className="text-xs text-slate-400">{inputText.length} chars · {inputText.split(/\s+/).filter(Boolean).length} words</span>
                            <div className="flex gap-2">
                                <button onClick={() => setShowInputModal(false)}
                                    className="px-4 py-2.5 rounded-xl font-bold text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">ปิด</button>
                                <button onClick={() => { setShowInputModal(false); handleGenerate(); }} disabled={isGenerating}
                                    className="px-5 py-2.5 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-teal-500 to-sky-500 hover:from-teal-600 hover:to-sky-600 transition-colors flex items-center gap-2 disabled:opacity-50">
                                    <i data-lucide="sparkles" className="w-4 h-4"></i> Generate
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};
