<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ============================================================
// REQUIREMENT PARSER
// ============================================================
const FEATURE_PATTERNS = [
    { kw: ['login', 'เข้าสู่ระบบ', 'sign in', 'signin', 'authenticate', 'authentication'],
      name: 'Login / Authentication', icon: 'log-in', color: 'blue' },
    { kw: ['register', 'registration', 'สมัครสมาชิก', 'สมัคร', 'sign up', 'signup', 'create account'],
      name: 'User Registration', icon: 'user-plus', color: 'emerald' },
    { kw: ['payment', 'ชำระเงิน', 'ชำระ', 'pay', 'checkout', 'order', 'billing', 'cart'],
      name: 'Payment Processing', icon: 'credit-card', color: 'violet' },
    { kw: ['search', 'ค้นหา', 'filter', 'กรอง', 'find', 'sort'],
      name: 'Search & Filter', icon: 'search', color: 'amber' },
    { kw: ['profile', 'โปรไฟล์', 'account settings', 'user settings'],
      name: 'Profile Management', icon: 'user', color: 'teal' },
    { kw: ['upload', 'อัพโหลด', 'file upload', 'document', 'attachment'],
      name: 'File Upload', icon: 'upload-cloud', color: 'sky' },
    { kw: ['notification', 'แจ้งเตือน', 'notify', 'push notification'],
      name: 'Notification System', icon: 'bell', color: 'orange' },
    { kw: ['reset password', 'forgot password', 'ลืมรหัสผ่าน', 'change password', 'เปลี่ยนรหัสผ่าน'],
      name: 'Password Reset', icon: 'key', color: 'indigo' },
    { kw: ['report', 'รายงาน', 'dashboard', 'analytics', 'chart', 'export'],
      name: 'Reports & Analytics', icon: 'bar-chart-2', color: 'rose' },
];

function extractNum(text, pats) {
    for (const p of pats) {
        const m = text.match(p);
        if (m) {
            for (let i = 1; i < m.length; i++) {
                const n = parseInt(m[i]);
                if (!isNaN(n) && n > 0) return n;
            }
        }
    }
    return null;
}

function getConditions(fname) {
    if (fname.includes('Login') || fname.includes('Authentication')) return {
        pre: ['ผู้ดูแลระบบได้สร้างบัญชีผู้ใช้ไว้แล้ว', 'ระบบได้กำหนด Username และ Password ให้ผู้ใช้แล้ว', 'Browser รองรับ JavaScript และ Cookies'],
        post: ['ผู้ใช้เข้าสู่ระบบสำเร็จ', 'ระบบนำทางไปยังหน้า Dashboard / Home', 'Session Token ถูกสร้างและจัดเก็บแล้ว'],
    };
    if (fname.includes('Registration')) return {
        pre: ['ระบบเปิดรับสมัครสมาชิกใหม่', 'Email ที่จะใช้สมัครยังไม่มีในระบบ'],
        post: ['บัญชีผู้ใช้ใหม่ถูกสร้างในระบบสำเร็จ', 'ระบบส่ง Email ยืนยันการสมัครสมาชิกให้ผู้ใช้'],
    };
    if (fname.includes('Payment')) return {
        pre: ['ผู้ใช้เข้าสู่ระบบแล้ว', 'มีสินค้าอยู่ในตะกร้าสินค้า', 'ข้อมูลบัตรหรือช่องทางชำระเงินพร้อมใช้งาน'],
        post: ['รายการชำระเงินถูกบันทึกในระบบ', 'ระบบส่ง Email ยืนยันการชำระเงินให้ผู้ใช้'],
    };
    if (fname.includes('Password Reset')) return {
        pre: ['ผู้ใช้มีบัญชีอยู่ในระบบ', 'Email ที่ลงทะเบียนไว้ยังสามารถใช้งานได้'],
        post: ['รหัสผ่านถูกเปลี่ยนสำเร็จ', 'Session เก่าทั้งหมดถูก Invalidate แล้ว'],
    };
    if (fname.includes('File Upload')) return {
        pre: ['ผู้ใช้เข้าสู่ระบบแล้ว', 'มีพื้นที่จัดเก็บเพียงพอในระบบ'],
        post: ['ไฟล์ถูกอัปโหลดและบันทึกสำเร็จ', 'ระบบแสดงรายการไฟล์ที่อัปโหลด'],
    };
    return {
        pre: ['ผู้ใช้เข้าสู่ระบบแล้ว', 'ระบบพร้อมใช้งาน'],
        post: ['ระบบทำงานตามที่กำหนดไว้', 'ผลลัพธ์แสดงถูกต้อง'],
    };
}

function parseRequirement(text) {
    if (!text || !text.trim()) return null;
    const lower = text.toLowerCase();

    const feature = FEATURE_PATTERNS.find(f => f.kw.some(k => lower.includes(k)))
        || { name: 'System Feature', icon: 'settings', color: 'slate' };

    const passwordMinLen = extractNum(text, [
        /(\d+)\s*(?:ตัวอักษร|characters?|chars?)/i,
        /(?:password|รหัสผ่าน)[^.\n]*?(?:อย่างน้อย|least|min)[^.\n]*?(\d+)/i,
        /(?:อย่างน้อย|least|min)[^.\n]*?(\d+)[^.\n]*?(?:ตัวอักษร|char)/i,
    ]);

    const failedAttempts = extractNum(text, [
        /(?:ผิด|wrong|fail|incorrect)[^.\n]*?(\d+)\s*(?:ครั้ง|times?|attempts?)/i,
        /(\d+)\s*(?:ครั้ง|times?|attempts?)[^.\n]*?(?:ล็อค|lock)/i,
        /(?:กรอกผิด|กรอกรหัสผิด)[^.\n]*?(?:เกิน\s*)?(\d+)/i,
        /(?:เกิน|exceed|more than)[^.\n]*?(\d+)[^.\n]*?(?:ครั้ง|time)/i,
    ]);

    const lockoutMins = extractNum(text, [
        /(\d+)\s*(?:นาที|minutes?|mins?)/i,
    ]);

    const hasSpecialChar = lower.includes('!@#$') || lower.includes('special char')
        || lower.includes('อักษรพิเศษ') || lower.includes('special character');

    const hasEmailNotif = lower.includes('email') &&
        (lower.includes('send') || lower.includes('ส่ง') || lower.includes('แจ้งเตือน') || lower.includes('notify'));

    const rawSentences = text.split(/[.\n]/)
        .map(s => s.replace(/^\s*\d+[.)]\s*/, '').trim())
        .filter(s => s.length > 5)
        .slice(0, 6);

    const { pre: preConditions, post: postConditions } = getConditions(feature.name);

    // Visual map scenarios
    const scenarios = [
        { icon: 'check-circle', c: 'emerald', t: 'Happy Path', d: 'ดำเนินการสำเร็จ' },
        { icon: 'x-circle', c: 'rose', t: 'Invalid Input', d: 'ข้อมูลไม่ถูกต้อง' },
    ];
    if (failedAttempts) scenarios.push({
        icon: 'lock', c: 'amber',
        t: `Lockout (${failedAttempts}x)`,
        d: lockoutMins ? `ล็อค ${lockoutMins} นาที` : 'บัญชีถูกล็อค',
    });
    scenarios.push({ icon: 'wifi-off', c: 'slate', t: 'Network Error', d: 'ปัญหาการเชื่อมต่อ' });
    if (passwordMinLen) scenarios.push({
        icon: 'shield-alert', c: 'violet', t: 'Validation', d: `รหัสผ่าน < ${passwordMinLen} ตัว`,
    });

    // Security rules for map
    const securityRules = [];
    if (passwordMinLen) securityRules.push({ icon: 'key-round', c: 'rose', text: `รหัสผ่านอย่างน้อย ${passwordMinLen} ตัวอักษร` });
    if (hasSpecialChar) securityRules.push({ icon: 'hash', c: 'violet', text: 'ต้องมีอักษรพิเศษ (!@#$)' });
    if (failedAttempts) securityRules.push({ icon: 'alert-triangle', c: 'amber', text: `Lock ถ้าผิด ${failedAttempts} ครั้ง${lockoutMins ? ` (${lockoutMins} นาที)` : ''}` });
    if (hasEmailNotif) securityRules.push({ icon: 'mail', c: 'sky', text: 'ส่ง Email แจ้งเตือนเมื่อ Lock' });
    if (securityRules.length === 0) {
        securityRules.push({ icon: 'shield-check', c: 'emerald', text: 'ตรวจสอบสิทธิ์การเข้าถึง (Auth)' });
        securityRules.push({ icon: 'lock', c: 'blue', text: 'ข้อมูลส่งผ่าน HTTPS เท่านั้น' });
    }

    const testCases = buildTestCases(feature.name, {
        passwordMinLen, failedAttempts, lockoutMins, hasSpecialChar, hasEmailNotif, preConditions, postConditions,
    });

    return {
        feature: feature.name, featureIcon: feature.icon, featureColor: feature.color,
        passwordMinLen, failedAttempts, lockoutMins, hasSpecialChar, hasEmailNotif,
        rawSentences, preConditions, postConditions, scenarios, securityRules, testCases,
        wordCount: text.split(/\s+/).filter(Boolean).length,
    };
}

function buildTestCases(fname, { passwordMinLen, failedAttempts, lockoutMins, hasSpecialChar, hasEmailNotif, preConditions, postConditions }) {
    const pre = preConditions.join('\n');
    const post = postConditions.join('\n');
    const tag0 = fname.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    const cases = [];

    cases.push({
        title: `[Happy Path] ${fname} - Successful Operation`,
        description: `Verify that the ${fname} feature works end-to-end with valid inputs`,
        preconditions: pre, postconditions: post,
        severity: 'critical', priority: 'high', type: 'functional', behavior: 'positive', automation: 'not-automated',
        tags: [tag0, 'smoke', 'regression'],
        steps: [
            { action: 'Navigate to the feature page', expected_result: 'Page loads correctly and all UI elements are visible', data: '' },
            { action: 'Enter all required fields with valid data', expected_result: 'All inputs accepted without error messages', data: 'Valid test data (correct format and values)' },
            { action: 'Click the main submit / action button', expected_result: `Operation succeeds. ${postConditions[0]}`, data: '' },
        ],
    });

    cases.push({
        title: `[Negative] ${fname} - Invalid Input / Wrong Data`,
        description: 'Verify system displays appropriate error messages for invalid input',
        preconditions: pre, postconditions: 'System shows appropriate error message; operation does not proceed',
        severity: 'major', priority: 'high', type: 'functional', behavior: 'negative', automation: 'not-automated',
        tags: [tag0, 'negative', 'regression'],
        steps: [
            { action: 'Navigate to the feature page', expected_result: 'Page displays correctly', data: '' },
            { action: 'Enter invalid or incorrect data in required fields', expected_result: 'System accepts input entry (no crash)', data: 'e.g. Wrong credentials, malformed data' },
            { action: 'Click submit', expected_result: 'Error message shown (highlighted in red). Operation does NOT proceed.', data: '' },
        ],
    });

    cases.push({
        title: `[Validation] ${fname} - Required Fields Empty`,
        description: 'Verify required field validation fires when fields are left blank',
        preconditions: pre, postconditions: 'All empty required fields are highlighted with validation error messages',
        severity: 'major', priority: 'medium', type: 'functional', behavior: 'negative', automation: 'not-automated',
        tags: ['validation', 'regression'],
        steps: [
            { action: 'Navigate to the feature page', expected_result: 'Page displays correctly', data: '' },
            { action: 'Leave ALL required fields empty and click submit', expected_result: 'Submit button is active (not disabled)', data: '' },
            { action: 'Observe validation feedback', expected_result: 'Every empty required field turns red with a clear error message. Page does not navigate away.', data: '' },
        ],
    });

    if (passwordMinLen) {
        cases.push({
            title: `[Validation] ${fname} - Password Too Short (under ${passwordMinLen} characters)`,
            description: `Verify the system enforces a minimum password length of ${passwordMinLen} characters`,
            preconditions: pre, postconditions: `Error displayed: "Password must be at least ${passwordMinLen} characters long"`,
            severity: 'major', priority: 'medium', type: 'functional', behavior: 'negative', automation: 'not-automated',
            tags: ['validation', 'password'],
            steps: [
                { action: 'Navigate to the feature page', expected_result: 'Page displays correctly', data: '' },
                { action: `Enter a password that is only ${Math.max(1, passwordMinLen - 2)} characters long`, expected_result: 'Password is entered into field', data: `Password: "Test@${passwordMinLen - 2 > 0 ? passwordMinLen - 2 : '1'}" (too short)` },
                { action: 'Submit the form', expected_result: `Validation error: "Password must be at least ${passwordMinLen} characters"`, data: '' },
            ],
        });
    }

    if (failedAttempts) {
        const lockSteps = [
            { action: 'Navigate to the login page', expected_result: 'Login page displays correctly', data: '' },
        ];
        for (let i = 1; i <= failedAttempts; i++) {
            lockSteps.push({
                action: `Enter wrong credentials — Attempt ${i} of ${failedAttempts}`,
                expected_result: i < failedAttempts
                    ? 'Error message shown. User may retry.'
                    : `After ${failedAttempts} consecutive failures, account is locked`,
                data: 'user@example.com / WrongPassword!',
            });
        }
        lockSteps.push({
            action: 'Attempt to login again (after lock)',
            expected_result: `System shows lockout message${lockoutMins ? `: "Account locked for ${lockoutMins} minutes"` : '. Account is inaccessible until unlocked.'}`,
            data: '',
        });
        cases.push({
            title: `[Security] ${fname} - Account Lock after ${failedAttempts} Failed Attempts`,
            description: `Verify account auto-locks after ${failedAttempts} consecutive failed login attempts`,
            preconditions: pre, postconditions: `Account is locked${lockoutMins ? ` for ${lockoutMins} minutes` : ''}`,
            severity: 'critical', priority: 'high', type: 'security', behavior: 'negative', automation: 'not-automated',
            tags: ['security', 'lockout', 'regression'],
            steps: lockSteps,
        });
    }

    if (hasSpecialChar) {
        cases.push({
            title: `[Validation] ${fname} - Password Missing Special Character`,
            description: 'Verify the system rejects passwords without at least one special character (!@#$)',
            preconditions: pre, postconditions: 'Error: "Password must contain at least 1 special character (!@#$)"',
            severity: 'normal', priority: 'medium', type: 'functional', behavior: 'negative', automation: 'not-automated',
            tags: ['validation', 'password'],
            steps: [
                { action: 'Navigate to the feature page', expected_result: 'Page displays correctly', data: '' },
                { action: `Enter a password of ${(passwordMinLen || 8)}+ characters but containing NO special characters`, expected_result: 'Password entered', data: `e.g. "StrongPassword${passwordMinLen || 8}" (meets length, no special char)` },
                { action: 'Submit the form', expected_result: 'Error: "Password must include at least 1 special character (!@#$%^&*)"', data: '' },
            ],
        });
    }

    if (hasEmailNotif && failedAttempts) {
        cases.push({
            title: `[Notification] ${fname} - Email Alert on Account Lock`,
            description: 'Verify an email notification is sent to the user when their account is locked',
            preconditions: pre + '\nUser has a registered and active email address in the system',
            postconditions: 'Email notification delivered within 5 minutes of account lock',
            severity: 'major', priority: 'medium', type: 'functional', behavior: 'negative', automation: 'not-automated',
            tags: ['notification', 'email', 'regression'],
            steps: [
                { action: `Trigger account lockout (${failedAttempts} consecutive wrong passwords)`, expected_result: 'Account is locked; lockout message displayed', data: '' },
                { action: 'Open the registered email inbox', expected_result: 'Email notification received within 5 minutes', data: 'user@example.com' },
                { action: 'Verify email content', expected_result: 'Email contains: lockout notice, timestamp of event, and instructions on how to unlock', data: '' },
            ],
        });
    }

    return cases;
}

const AI_DEFAULTS = {

                       jiraUrl: '', jiraEmail: '', jiraToken: '' };
    try {
        const raw = localStorage.getItem('visualreq_ai');

// ---- History (saved generations) ----
const HISTORY_KEY = 'visualreq_history';
const HISTORY_MAX = 30;

function loadHistory() {
    try {
        const raw = localStorage.getItem(HISTORY_KEY);
        if (raw) return JSON.parse(raw);
    } catch (e) {}
    return [];
}
function writeHistory(list) {

// Prepend a new entry; returns the updated list.
function addHistory(list, entry) {
    const item = {
        id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
        ts: Date.now(),
        feature: entry.parsed?.feature || 'Requirement',
        inputText: entry.inputText,
        parsed: entry.parsed,
        mode: entry.mode || 'offline',
    };
    const next = [item, ...list];
    writeHistory(next);
    return next;
}
function fmtTime(ts) {
    try {
        const d = new Date(ts);
        return d.toLocaleString('th-TH', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
}

// Derive a Story search term from a bug summary: pull the descriptive
// bracket (e.g. "[BO][Add Debtor/Customer]" → "Add Debtor/Customer"),
// skipping short area-code brackets like [BO]/[MB]/[FE].
const _STORY_AREA_CODES = /^(bo|mb|fe|be|qa|ui|ux|api|db|ios|and|web|pm|dev|sit|uat|prod|infra|ops)$/i;
function extractStoryQuery(summary) {
    if (!summary) return '';
    const brackets = [...summary.matchAll(/\[([^\]]+)\]/g)].map(m => m[1].trim()).filter(Boolean);
    const candidates = brackets.filter(b => !_STORY_AREA_CODES.test(b));
    if (candidates.length) return candidates.sort((a, b) => b.length - a.length)[0];
    // No descriptive bracket → use the text after brackets, up to the first separator.
    const rest = summary.replace(/\[[^\]]*\]/g, '').trim();
    return rest.split(/[-–—:]/)[0].trim().slice(0, 60);
}

// ---- Bug paste auto-fill: split a whole pasted bug report into form fields ----
// Section headers it recognises (plus any Jira field name passed in). Matched
// headers → their field; "Severity / Priority" → the two dropdowns; everything
// else (Environment, Data test, Pre-condition, Attachment, Note, ...) → Description.
function splitBugSections(text, fieldNames) {
    const known = new Set([
        'summary', 'environment', 'data test', 'pre-condition', 'precondition',
        'steps to reproduce', 'actual result', 'expected result', 'attachment',
        'severity / priority', 'severity/priority', 'severity', 'priority', 'note',
        ...(fieldNames || []).map(n => (n || '').trim().toLowerCase()),
    ]);
    const lines = (text || '').replace(/\r/g, '').split('\n');
    const sections = [];
    let cur = null;
    for (const line of lines) {
        const stripped = line.trim();
        const ci = stripped.search(/[:：]/);
        const label = (ci >= 0 ? stripped.slice(0, ci) : stripped).trim();
        const inline = ci >= 0 ? stripped.slice(ci + 1).trim() : '';
        if (label && known.has(label.toLowerCase())) {
            cur = { header: label, content: inline };
            sections.push(cur);
        } else if (cur) {
            cur.content += (cur.content ? '\n' : '') + line;
        }
    }
    return sections;
}

// fields: meta.fields [{id,name,type,options:[{id,label}]}]
// → { summary, description, fieldValues:{id:val}, report:[{label,target}], warnings:[] }
function parseBugPaste(text, fields) {
    const res = { summary: '', description: '', fieldValues: {}, report: [], warnings: [] };
    const findField = (name) => (fields || []).find(f => f.name.trim().toLowerCase() === name.trim().toLowerCase());
    const matchOption = (field, raw) => {
        if (!field || !field.options) return null;
        const r = (raw || '').trim().toLowerCase();
        if (!r) return null;
        let o = field.options.find(o => (o.label || '').trim().toLowerCase() === r);
        if (!o) o = field.options.find(o => r.includes((o.label || '').toLowerCase()) || (o.label || '').toLowerCase().includes(r));
        return o ? o.id : null;
    };
    const setSelect = (fieldName, raw, srcLabel) => {
        const fld = findField(fieldName);
        if (!fld) return;
        const id = matchOption(fld, raw);
        if (id) { res.fieldValues[fld.id] = id; res.report.push({ label: `${srcLabel} → ${raw}`, target: fld.name }); }
        else res.warnings.push(`จับคู่ "${fieldName}: ${raw}" กับตัวเลือกในฟอร์มไม่ได้ — เลือกเองนะคะ`);
    };

    const sections = splitBugSections(text, (fields || []).map(f => f.name));
    const descParts = [];
    for (const { header, content } of sections) {
        const hl = header.trim().toLowerCase();
        const body = (content || '').trim();
        if (hl === 'summary') {
            res.summary = (body.split('\n')[0] || body).trim();
            res.report.push({ label: 'Summary', target: 'Summary' });
            continue;
        }
        if (hl === 'severity / priority' || hl === 'severity/priority') {
            for (const ln of body.split('\n')) {
                const sm = ln.match(/severity\s*[:：]\s*(.+)/i);
                if (sm) setSelect('Severity', sm[1].split('(')[0].trim(), 'Severity');
                const pm = ln.match(/priority\s*[:：]\s*(.+)/i);
                if (pm) setSelect('Priority', pm[1].split('(')[0].trim(), 'Priority');
            }
            continue;
        }
        const fld = findField(header);
        if (fld) {
            if (fld.type === 'select') { setSelect(header, body, header); continue; }
            if (fld.type === 'multiselect') {
                const ids = body.split(/[,\n]/).map(s => matchOption(fld, s)).filter(Boolean);
                if (ids.length) { res.fieldValues[fld.id] = [...new Set(ids)]; res.report.push({ label: header, target: fld.name }); continue; }
            } else { // text / textarea / number / etc.
                res.fieldValues[fld.id] = body;
                res.report.push({ label: header, target: fld.name });
                continue;
            }
        }
        // unmatched → Description (keep the heading)
        if (body) descParts.push(header + '\n' + body);
    }
    res.description = descParts.join('\n\n').trim();
    if (!res.summary) res.warnings.push('ไม่พบหัวข้อ "Summary" — กรอก Summary เองนะคะ');
    return res;
}

// Line-based diff via LCS → [{type:'same'|'add'|'del', text}]
function diffLines(oldStr, newStr) {
    const a = (oldStr || '').split('\n');
    const b = (newStr || '').split('\n');
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--)
        for (let j = m - 1; j >= 0; j--)
            dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) {
        if (a[i] === b[j]) { out.push({ type: 'same', text: a[i] }); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ type: 'del', text: a[i] }); i++; }
        else { out.push({ type: 'add', text: b[j] }); j++; }
    }
    while (i < n) out.push({ type: 'del', text: a[i++] });
    while (j < m) out.push({ type: 'add', text: b[j++] });
    return out;
}

// Ask the AI for a structured requirement analysis. `opts` controls which parts
// are generated so we can SKIP unneeded output (save tokens):
//   opts.visualMap → Pre/Post/Business/AC fields (for the Visual Map)
//   opts.testCases → the Qase test cases
async function aiGenerateTestCases(text, settings, onRetry, opts) {
    const wantMap = !opts || opts.visualMap !== false;
    const wantTC = !opts || opts.testCases !== false;

    // --- JSON shape (dynamic — only ask for the parts that are enabled) ---
    const fields = [
        `  "feature": "short feature name (e.g. 'Login / Authentication')"`,
        `  "scope": "1-2 sentences: what this suite covers + any items EXCLUDED and why"`,
    ];
    if (wantMap) fields.push(
        `  "preConditions": ["string", ...]`,
        `  "postConditions": ["string", ...]`,
        `  "businessRules": ["string", ...]`,
        `  "scenarios": [{"title":"short","detail":"short","type":"positive|negative|edge|security"}]`,
        `  "acceptanceCriteria": [{"title":"AC/US heading VERBATIM","items":["every Given/When/Then/And/bullet line VERBATIM word-for-word"]}]`
    );
    if (wantTC) fields.push(
        `  "testCases": [{"title":"ตรวจสอบ... (see title rule)","description":"string","preconditions":"string","postconditions":"string","severity":"blocker|critical|major|normal|minor|trivial","priority":"high|medium|low","type":"functional|security|usability|performance|regression|smoke|acceptance","behavior":"positive|negative|destructive","automation":"to-be-automated","tags":["string"],"steps":[{"action":"string (Thai)","expected_result":"string (Thai)","data":"string"}]}]`
    );
    const shape = '{\n' + fields.join(',\n') + '\n}';

    // --- Rules (only include the ones relevant to the enabled parts) ---
    const parts = [
        `You are an Expert QA Automation Engineer. Analyze the requirement and return ONLY valid JSON (no markdown, no prose) that EXACTLY matches the shape below. Do NOT add any key that is not in the shape.`,
        `Language: write all human-readable values in THAI, but keep UI components and technical terms in ORIGINAL ENGLISH (Breadcrumb, Empty State, Validation Error, Dropdown, Tooltip, Stacked Bar Chart, Read-only, Submit, Toast).`,
    ];
    if (wantMap) parts.push(
        `VISUAL MAP fields: "acceptanceCriteria" copies the Acceptance Criteria section VERBATIM — every AC/US heading and every Given/When/Then/And/bullet line word-for-word, grouped under its heading; do NOT shorten, paraphrase, merge, or omit any line (empty array if none). preConditions/postConditions/businessRules are concise bullet lists taken from the requirement.`
    );
    if (wantTC) parts.push(
        `TEST CASES (concise, grouped, like a senior QA lead — NOT exhaustive per-widget):
- Group by SCREEN AREA / USER FLOW: combine multiple User Stories/widgets into ONE test case; NEVER one giant case covering everything. Produce several MEDIUM cases (3-7 steps each, ~12-18 steps total for a big feature).
- One step verifies ONE widget/area. FOLD Hover/Tooltip/Legend/sort/scroll into that widget's step expected_result — do NOT make separate steps for them. Pack multiple related checks into one dense expected_result.
- Cover Positive (happy path) + Negative (empty/error); add Edge/Security only if the AC requires it.
- EXCLUDE pending/uncertain items ("รอคุยกับ design", "รอ confirm", "ตัดออก", "TBD") — do not write steps for them; note the exclusion in "scope".
- TITLE: every testCase title MUST begin with the Thai word "ตรวจสอบ" and describe the widgets/areas (technical terms in English). It must NOT contain ANY square-bracket tag ([Functional]/[Positive]/[Negative]/...). Example: "ตรวจสอบการทำงานของ Tab Navigation, Filter Header และฟังก์ชัน Export".`
    );
    parts.push(`Shape:\n${shape}`);

    const system = parts.join('\n\n');
    const out = await callAIWithRetry(settings, system, text, onRetry);
    const ai = extractJson(out);
    return normalizeAIResult(ai, text);
}

// POST JSON and parse the JSON reply. If the server returns HTML instead of
// JSON (e.g. a 404 page because server.py is an OLD version that lacks this
// endpoint), surface a clear message instead of the cryptic
// "Unexpected token '<'" that res.json() would throw on "<!DOCTYPE ...".
async function postJson(path, body) {
    let res;
    try {
        res = await fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
    } catch (e) {
        throw new Error(`เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (${path}) — ตรวจว่า server.py กำลังรันอยู่`);
    }
    const text = await res.text();
    let data;
    try {
        data = JSON.parse(text);
    } catch (e) {
        if (res.status === 404)
            throw new Error(`ไม่พบ endpoint ${path} (HTTP 404) — server.py เป็นเวอร์ชันเก่า กรุณาปิดแล้วรัน "python3 server.py" ใหม่`);
        throw new Error(`เซิร์ฟเวอร์ตอบกลับไม่ใช่ JSON (HTTP ${res.status}) — ลองรีสตาร์ท server.py`);
    }
    if (!res.ok || data.error) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
}

// Shorthand: send the three Jira credentials plus `extra` to `path`.
function jiraPost(path, settings, extra) {
    return postJson(path, { baseUrl: settings.jiraUrl, email: settings.jiraEmail, token: settings.jiraToken, ...extra });

async function callAI(settings, system, prompt) {

        provider: settings.provider,
        apiKey: settings.apiKey,
        model: settings.model || AI_DEFAULTS[settings.provider]?.model || '',
        endpoint: settings.endpoint,
        system, prompt,
    });
    return data.text;
}

// Run async tasks with a concurrency cap (avoid hammering Jira).
async function runLimited(items, limit, worker) {
    const results = new Array(items.length);
    let idx = 0;
    async function next() {
        while (idx < items.length) {
            const i = idx++;
            results[i] = await worker(items[i], i);
        }
    }
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, next));
    return results;
}

// Is this error worth retrying? (server overload / transient network — NOT auth/quota/bad-model)
function isTransient(msg) {
    const m = (msg || '').toLowerCase();
    if (/\b(500|503|529)\b/.test(m)) return true; // overload / server error status codes
    return /overload|unavailable|high demand|temporarily|timeout|timed out|failed to fetch|networkerror|load failed/.test(m);
}

// Exponential backoff: retry transient failures so users rarely see offline mode.
// onRetry(attemptNumber, totalAttempts, waitSeconds) updates the UI between tries.
async function callAIWithRetry(settings, system, prompt, onRetry) {
    const delays = [2000, 4000, 8000]; // 2s → 4s → 8s, then give up (4 attempts total)
    let lastErr;
    for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
            return await callAI(settings, system, prompt);
        } catch (e) {
            lastErr = e;
            if (attempt < delays.length && isTransient(e.message)) {
                const wait = delays[attempt];
                if (onRetry) onRetry(attempt + 1, delays.length, Math.round(wait / 1000));
                await new Promise(r => setTimeout(r, wait));
                continue;
            }
            throw e; // permanent error (bad key, quota, bad model) — don't retry
        }
    }
    throw lastErr;
}

// Pull a JSON object out of an LLM response (handles ```json fences / stray text).
function extractJson(text) {
    if (!text) throw new Error('Empty AI response');
    let t = text.trim();
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (fence) t = fence[1].trim();
    const start = t.indexOf('{');
    const end = t.lastIndexOf('}');
    if (start !== -1 && end !== -1) t = t.slice(start, end + 1);
    return JSON.parse(t);
}

// Map the AI's semantic JSON onto the exact fields VisualMap + QaseJsonView expect.
function normalizeAIResult(ai, text) {
    const lower = (ai.feature || '').toLowerCase();
    const fp = FEATURE_PATTERNS.find(f => f.kw.some(k => lower.includes(k.toLowerCase())))
        || { icon: 'settings', color: 'slate' };
    return {
        feature: ai.feature || 'System Feature',
        scope: ai.scope || '',
        featureIcon: fp.icon,
        featureColor: fp.color,
        preConditions: ai.preConditions || [],
        postConditions: ai.postConditions || [],
        rawSentences: ai.businessRules || [],
        securityRules: (ai.securityRules || []).map((text, i) => ({
            ...SEC_ICON_CYCLE[i % SEC_ICON_CYCLE.length], text,
        })),
        scenarios: (ai.scenarios || []).map(s => ({
            ...(SCENARIO_TYPE[s.type] || SCENARIO_TYPE.positive),
            t: s.title, d: s.detail,
        })),
        acceptanceCriteria: Array.isArray(ai.acceptanceCriteria) ? ai.acceptanceCriteria : [],
        testCases: ai.testCases || [],
        wordCount: text.split(/\s+/).filter(Boolean).length,
    };
}

const VisualMap = ({ parsed }) => {

            return;

        setExporting(true);
        try {
            const canvas = await window.html2canvas(boardRef.current, {
                scale: 2,                 // 2x for sharp output
                backgroundColor: '#ffffff',
                useCORS: true,

                // The .fade-up entrance animation starts at opacity:0. In html2canvas's

                onclone: (doc) => {

// ============================================================
// QASE IMPORT FORMAT CONVERTER
// ============================================================
// Map any AI/parser value onto the exact enum strings Qase accepts.
const QASE_PRIORITY = { high: 'high', medium: 'medium', low: 'low', normal: 'medium', critical: 'high' };
const QASE_SEVERITY = { blocker: 'blocker', critical: 'critical', major: 'major', normal: 'normal', minor: 'minor', trivial: 'trivial' };
const QASE_TYPE = { functional: 'functional', smoke: 'smoke', regression: 'regression', security: 'security', usability: 'usability', performance: 'performance', acceptance: 'acceptance', integration: 'integration', compatibility: 'compatibility', exploratory: 'exploratory' };
const QASE_BEHAVIOR = { positive: 'positive', negative: 'negative', destructive: 'destructive' };
const QASE_AUTOMATION = { 'to-be-automated': 'to-be-automated', 'automated': 'automated', 'is-not-automated': 'is-not-automated', 'not-automated': 'is-not-automated', 'manual': 'is-not-automated' };
const pick = (map, v, def) => map[String(v || '').toLowerCase().trim()] || def;

// Force every title to the boss's style: strip any "[Tag]" prefix and ensure it
// starts with "ตรวจสอบ" (deterministic — guarantees the format even if the AI ignores the prompt).
function cleanTitle(title) {
    let t = (title || '').trim();
    t = t.replace(/^\s*\[[^\]]*\]\s*/, '');        // remove leading [Functional]/[Positive]/... tag
    t = t.replace(/^(test case|tc)\s*\d*[:.\-]?\s*/i, ''); // remove generic "Test Case N" lead-ins
    if (!t) return 'ตรวจสอบ Test Case';
    if (!t.startsWith('ตรวจสอบ')) {
        const sep = /^[A-Za-z0-9]/.test(t) ? ' ' : '';   // space before Latin, none before Thai
        t = 'ตรวจสอบ' + sep + t;
    }
    return t;
}

// Wrap parsed.testCases into the official Qase suites/cases/steps import structure.
function toQaseImport(parsed) {
    if (!parsed) return { suites: [] };
    const cases = (parsed.testCases || []).map((tc, i) => ({
        id: i + 1,
        title: cleanTitle(tc.title) || `ตรวจสอบ Test Case ${i + 1}`,
        description: tc.description || '',
        preconditions: tc.preconditions || '',
        postconditions: tc.postconditions || '',
        priority: pick(QASE_PRIORITY, tc.priority, 'medium'),
        severity: pick(QASE_SEVERITY, tc.severity, 'normal'),
        type: pick(QASE_TYPE, tc.type, 'functional'),
        behavior: pick(QASE_BEHAVIOR, tc.behavior, 'positive'),
        automation: pick(QASE_AUTOMATION, tc.automation, 'to-be-automated'),
        status: 'actual',
        is_flaky: 'no',
        layer: 'e2e',
        milestone: null,
        custom_fields: [],
        steps_type: 'classic',
        tags: Array.isArray(tc.tags) ? tc.tags : [],
        params: [],
        is_muted: 'no',
        steps: (tc.steps || []).map((s, j) => ({
            position: j + 1,
            action: s.action || '',
            expected_result: s.expected_result || s.expected || '',
            data: s.data || '',
            steps: [],
        })),
    }));
    return {
        suites: [{
            id: 1,
            title: parsed.feature || 'Test Suite',
            description: parsed.scope || '',
            preconditions: (parsed.preConditions || []).join(' • '),
            suites: [],
            cases,
        }],
    };
}

const QaseJsonView = ({ parsed, onDownload }) => {
    const [copied, setCopied] = useState(false);
    const json = JSON.stringify(toQaseImport(parsed), null, 2);

    const handleCopy = () => {
        navigator.clipboard.writeText(json).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2500);
        });
    };

    return (
        <div className="h-full p-5 flex flex-col gap-4 animate-in fade-in bg-slate-50">
            {/* Stats bar */}
            {parsed && (
                <div className="flex gap-3 flex-wrap">
                    <span className="bg-sky-100 text-sky-700 text-xs font-bold px-3 py-1.5 rounded-full">{parsed.testCases.length} Test Cases</span>
                    {parsed.testCases.filter(t => t.severity === 'critical').length > 0 &&
                        <span className="bg-rose-100 text-rose-700 text-xs font-bold px-3 py-1.5 rounded-full">{parsed.testCases.filter(t => t.severity === 'critical').length} Critical</span>}
                    {parsed.testCases.filter(t => t.type === 'security').length > 0 &&
                        <span className="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1.5 rounded-full">{parsed.testCases.filter(t => t.type === 'security').length} Security</span>}
                </div>
            )}

            {/* Actions */}
            <div className="flex justify-between items-center">
                <h3 className="text-sm font-bold text-slate-700">Qase Import JSON (suites/cases)</h3>
                <div className="flex gap-2">
                    <button onClick={handleCopy}
                        className={`px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 transition-colors shadow-sm
                            ${copied ? 'bg-emerald-500 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:border-slate-400'}`}>
                        <i data-lucide={copied ? 'check' : 'copy'} className="w-4 h-4"></i>
                        {copied ? 'Copied!' : 'Copy'}
                    </button>
                    <button onClick={onDownload}
                        className="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 shadow-sm transition-colors">
                        <i data-lucide="download-cloud" className="w-4 h-4"></i> Export to Qase
                    </button>
                </div>
            </div>

            <div className="flex-grow bg-slate-900 rounded-xl p-4 overflow-auto border border-slate-800 shadow-inner min-h-0">
                <pre className="text-sky-300 text-xs font-mono leading-relaxed whitespace-pre-wrap">{json}</pre>
            </div>
        </div>
    );
};

                                className="w-full px-3 py-2 bg-slate-50 border-2 border-slate-200 rounded-lg text-xs focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 outline-none font-mono" />
                            <input type="text" value={draft.jiraEmail} onChange={e => set('jiraEmail', e.target.value)}
                                placeholder="Email — you@company.com"
                                className="w-full px-3 py-2 bg-slate-50 border-2 border-slate-200 rounded-lg text-xs focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 outline-none font-mono" />
                            <input type="password" value={draft.jiraToken} onChange={e => set('jiraToken', e.target.value)}
                                placeholder="API Token"
                                className="w-full px-3 py-2 bg-slate-50 border-2 border-slate-200 rounded-lg text-xs focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 outline-none font-mono" />
                        </div>
                    </div>

                    <div className="bg-sky-50 border border-sky-100 rounded-lg p-3 text-xs text-sky-700 flex gap-2">
                        <i data-lucide="shield-check" className="w-4 h-4 shrink-0 mt-0.5"></i>
                        <span>API Key / Jira Token ถูกเก็บในเครื่องคุณ (localStorage) และส่งผ่าน backend proxy เท่านั้น ไม่ถูกฝังในหน้าเว็บ</span>
                    </div>
                </div>

                <div className="flex gap-3 p-5 border-t border-slate-100">
                    <button onClick={onClose} className="flex-1 py-2.5 rounded-xl font-bold text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">ยกเลิก</button>
                    <button onClick={() => onSave(draft)} className="flex-1 py-2.5 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-teal-500 to-sky-500 hover:from-teal-600 hover:to-sky-600 transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="check" className="w-4 h-4"></i> บันทึก
                    </button>
                </div>
            </div>
        </div>
    );
};

// ============================================================
// BUG REPORTER (create Jira bugs with reusable field templates + a
// live daily-summary report, both built on the Jira creds from Settings)
// ============================================================
const BugTab = ({ settings }) => {
    const jiraOn = settings.jiraUrl && settings.jiraEmail && settings.jiraToken;
    const [activeSub, setActiveSub] = useState('create');
    const [projects, setProjects] = useState([]);
    const [projectsLoading, setProjectsLoading] = useState(false);
    const [projectsError, setProjectsError] = useState('');

    useEffect(() => {
        if (!jiraOn) return;
        let cancelled = false;
        setProjectsLoading(true);
        setProjectsError('');
        fetchJiraProjects(settings)
            .then(list => { if (!cancelled) setProjects(list); })
            .catch(e => { if (!cancelled) setProjectsError(e.message); })
            .finally(() => { if (!cancelled) setProjectsLoading(false); });
        return () => { cancelled = true; };
    }, [jiraOn, settings.jiraUrl, settings.jiraEmail, settings.jiraToken]);

    if (!jiraOn) {
        return (
            <div className="bg-white rounded-2xl border border-dashed border-slate-200 p-12 text-center text-slate-400">
                <div className="text-4xl mb-3">🐞</div>
                <p className="text-sm">ยังไม่ได้ตั้งค่า Jira — เปิด ⚙️ Settings แล้วกรอก Base URL, Email และ API Token ก่อนใช้งาน</p>
            </div>
        );
    }

    return (
        <div className="space-y-4">
            <div className="flex gap-2 border-b border-slate-200">
                <button onClick={() => setActiveSub('create')}
                    className={`py-2.5 px-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-1.5
                        ${activeSub === 'create' ? 'border-amber-500 text-amber-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                    ➕ สร้างบั๊ก
                </button>
                <button onClick={() => setActiveSub('report')}
                    className={`py-2.5 px-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-1.5
                        ${activeSub === 'report' ? 'border-amber-500 text-amber-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                    📅 สรุปรายวัน
                </button>
            </div>
            {projectsError && <p className="text-[11px] text-rose-600 break-all bg-rose-50 border border-rose-200 rounded p-2">{projectsError}</p>}
            {projectsLoading && <p className="text-[11px] text-slate-400">กำลังโหลดรายการโปรเจกต์...</p>}
            {activeSub === 'create'
                ? <BugCreatePanel settings={settings} projects={projects} />
                : <BugReportPanel settings={settings} projects={projects} />}
        </div>
    );
};

const BugCreatePanel = ({ settings, projects }) => {
    const [projectKey, setProjectKey] = useState('');
    const [issuetypeId, setIssuetypeId] = useState(''); // '' → let server default to "Issue"
    const [metaCache, setMetaCache] = useState({});     // keyed by `${projectKey}|${issuetypeId}`
    const [metaLoading, setMetaLoading] = useState(false);
    const [metaError, setMetaError] = useState('');
    const [summary, setSummary] = useState('');
    const [description, setDescription] = useState('');
    const [fieldValues, setFieldValues] = useState({});
    const [pasteText, setPasteText] = useState('');       // whole-bug paste → auto-fill
    const [showPaste, setShowPaste] = useState(false);
    const [pasteReport, setPasteReport] = useState(null); // {report, warnings} after auto-fill
    const [templates, setTemplates] = useState(loadBugTemplates);
    const [selectedTemplate, setSelectedTemplate] = useState('');
    const [submitting, setSubmitting] = useState(false);
    const [submitError, setSubmitError] = useState('');
    const [lastCreated, setLastCreated] = useState(null);
    const [showAllFields, setShowAllFields] = useState(false);
    const [sprintCache, setSprintCache] = useState({}); // keyed by projectKey
    const [sprintId, setSprintId] = useState('');
    const [sprintError, setSprintError] = useState('');
    const [autoSubtask, setAutoSubtask] = useState(true); // auto-create QA retest subtask
    const [lastSubtask, setLastSubtask] = useState(null);
    const [prefs, setPrefs] = useState(loadBugPrefs); // {defaultProject, pinned:[]}
    const [storyQuery, setStoryQuery] = useState('');   // Story search term (auto-derived, editable)
    const [storyMatches, setStoryMatches] = useState([]);
    const [selectedStory, setSelectedStory] = useState(''); // Story key to link, or '' for none
    const [storyLoading, setStoryLoading] = useState(false);
    const [linkStory, setLinkStory] = useState(true);   // whether to auto-link a Story
    const [lastLink, setLastLink] = useState(null);

    const meta = projectKey ? metaCache[`${projectKey}|${issuetypeId}`] : null;
    const sprints = projectKey ? (sprintCache[projectKey] || null) : null;

    // Split createmeta fields into the preferred (screenshot) set — in the
    // PREFERRED_BUG_FIELDS order — and everything else.
    const preferredFields = (meta ? PREFERRED_BUG_FIELDS
        .map(name => meta.fields.find(f => f.name === name))
        .filter(Boolean) : []);
    const otherFields = (meta ? meta.fields.filter(f => !PREFERRED_BUG_FIELDS.includes(f.name)) : []);

    useEffect(() => {
        if (projectKey || !projects.length) return;
        const def = prefs.defaultProject && projects.find(p => p.key === prefs.defaultProject);
        setProjectKey(def ? def.key : projects[0].key);
    }, [projects]);

    const isPinned = projectKey && prefs.pinned.includes(projectKey);
    const isDefault = projectKey && prefs.defaultProject === projectKey;
    const togglePin = () => {
        if (!projectKey) return;
        setPrefs(prev => {
            const pinned = prev.pinned.includes(projectKey)
                ? prev.pinned.filter(k => k !== projectKey)
                : [...prev.pinned, projectKey];
            const next = { ...prev, pinned };
            saveBugPrefs(next);
            return next;
        });
    };
    const makeDefault = () => {
        if (!projectKey) return;
        setPrefs(prev => {
            const next = { ...prev, defaultProject: prev.defaultProject === projectKey ? '' : projectKey };
            saveBugPrefs(next);
            return next;
        });
    };
    const pinnedProjects = projects.filter(p => prefs.pinned.includes(p.key));
    const otherProjects = projects.filter(p => !prefs.pinned.includes(p.key));

    useEffect(() => {
        if (!projectKey) return;
        if (metaCache[`${projectKey}|${issuetypeId}`]) return;
        let cancelled = false;
        setMetaLoading(true);
        setMetaError('');
        fetchJiraCreateMeta(settings, projectKey, issuetypeId)
            .then(data => {
                if (cancelled) return;
                // Cache under the requested key AND the resolved type, so setting
                // issuetypeId from a default fetch doesn't trigger a second call.
                setMetaCache(c => ({
                    ...c,
                    [`${projectKey}|${issuetypeId}`]: data,
                    [`${projectKey}|${data.issuetypeId}`]: data,
                }));
                if (!issuetypeId && data.issuetypeId) setIssuetypeId(data.issuetypeId);
            })
            .catch(e => { if (!cancelled) setMetaError(e.message); })
            .finally(() => { if (!cancelled) setMetaLoading(false); });
        return () => { cancelled = true; };
    }, [projectKey, issuetypeId]);

    // Fetch sprints once per project; default to the active sprint.
    useEffect(() => {
        if (!projectKey || sprintCache[projectKey]) return;
        let cancelled = false;
        setSprintError('');
        fetchJiraSprints(settings, projectKey)
            .then(list => {
                if (cancelled) return;
                setSprintCache(c => ({ ...c, [projectKey]: list }));
                const active = list.find(s => s.state === 'active') || list[0];
                if (active) setSprintId(String(active.id));
            })
            .catch(e => { if (!cancelled) setSprintError(e.message); });
        return () => { cancelled = true; };
    }, [projectKey]);

    // Keep the Story search term in sync with the Summary (until the user edits
    // the term by hand, tracked via storyQueryTouched).
    const [storyQueryTouched, setStoryQueryTouched] = useState(false);
    useEffect(() => {
        if (!storyQueryTouched) setStoryQuery(extractStoryQuery(summary));
    }, [summary, storyQueryTouched]);

    // Debounced Story search; auto-select the best match (exact summary, else first).
    useEffect(() => {
        if (!linkStory || !projectKey || storyQuery.trim().length < 2) { setStoryMatches([]); return; }
        let cancelled = false;
        setStoryLoading(true);
        const t = setTimeout(() => {
            fetchJiraStories(settings, projectKey, storyQuery)
                .then(list => {
                    if (cancelled) return;
                    setStoryMatches(list);
                    const exact = list.find(s => s.summary.trim().toLowerCase() === storyQuery.trim().toLowerCase());
                    setSelectedStory((exact || list[0]) ? (exact || list[0]).key : '');
                })
                .catch(() => { if (!cancelled) setStoryMatches([]); })
                .finally(() => { if (!cancelled) setStoryLoading(false); });
        }, 500);
        return () => { cancelled = true; clearTimeout(t); };
    }, [storyQuery, projectKey, linkStory]);

    const templateNames = Object.keys(templates).filter(n => templates[n].projectKey === projectKey);

    const insertSnippet = (text) => setDescription(d => d.trim() ? (d.replace(/\s+$/, '') + '\n\n' + text) : text);

    // Paste a whole bug report → auto-split into Summary / fields / Description.
    const handleAutoFill = () => {
        if (!pasteText.trim()) return;
        if (!meta) { setPasteReport({ report: [], warnings: ['เลือกโปรเจกต์ให้โหลดฟิลด์เสร็จก่อนนะคะ'] }); return; }
        const r = parseBugPaste(pasteText, meta.fields || []);
        if (r.summary) setSummary(r.summary);
        setDescription(r.description);
        if (Object.keys(r.fieldValues).length) setFieldValues(v => ({ ...v, ...r.fieldValues }));
        setPasteReport({ report: r.report, warnings: r.warnings });
    };

    const setFieldValue = (id, value) => setFieldValues(v => ({ ...v, [id]: value }));
    const toggleMultiValue = (id, optId) => setFieldValues(v => {
        const cur = v[id] || [];
        const next = cur.includes(optId) ? cur.filter(x => x !== optId) : [...cur, optId];
        return { ...v, [id]: next };
    });

    const applyTemplate = (name) => {
        setSelectedTemplate(name);
        if (name && templates[name]) setFieldValues(templates[name].fieldValues || {});
    };
    const saveTemplate = () => {
        const name = window.prompt('ตั้งชื่อ Template (เช่น "BO Bug", "MB Bug")');
        if (!name) return;
        const next = { ...templates, [name]: { projectKey, fieldValues } };
        setTemplates(next);
        saveBugTemplates(next);
        setSelectedTemplate(name);
    };
    const deleteTemplate = (name) => {
        if (!window.confirm(`ลบ Template "${name}"?`)) return;
        const next = { ...templates };
        delete next[name];
        setTemplates(next);
        saveBugTemplates(next);
        if (selectedTemplate === name) setSelectedTemplate('');
    };

    const handleSubmit = async () => {
        if (!projectKey || !meta) { setSubmitError('กรุณาเลือกโปรเจกต์'); return; }
        if (!summary.trim()) { setSubmitError('กรุณากรอก Summary'); return; }
        setSubmitting(true);
        setSubmitError('');
        setLastCreated(null);
        setLastSubtask(null);
        setLastLink(null);
        const storyToLink = (linkStory && selectedStory) ? selectedStory : '';
        try {
            const fields = meta.fields
                .map(f => ({ id: f.id, type: f.type, value: fieldValues[f.id] }))
                .filter(f => !(f.value === undefined || f.value === '' || (Array.isArray(f.value) && f.value.length === 0)));
            const result = await createJiraIssue(settings, {
                projectKey, issuetypeId: meta.issuetypeId, summary: summary.trim(), description, fields,
                sprintFieldId: meta.sprintFieldId || '', sprintId: (meta.sprintFieldId && sprintId) ? sprintId : '',
            });
            setLastCreated(result);
            setSummary('');
            setDescription('');
            setStoryQueryTouched(false);
            // Keep fieldValues — that's the point of a template: fewer clicks on the NEXT bug.

            // Auto-create the QA retest subtask under the new issue.
            if (autoSubtask) {
                try {
                    const sub = await createJiraSubtask(settings, {
                        projectKey, parentKey: result.key,
                        summary: `[QA] Bug log & Retest ${result.key}`,
                        assignToMe: true, billType: 'Non-Billable',
                    });
                    setLastSubtask(sub);
                } catch (e) {
                    // Parent succeeded — surface the subtask failure without losing the parent link.
                    setSubmitError(`สร้างการ์ดหลักสำเร็จ (${result.key}) แต่สร้าง Subtask ไม่สำเร็จ: ${e.message}`);
                }
            }

            // Auto-link the matching Story with a 'Relates' link.
            if (storyToLink) {
                try {
                    await createJiraLink(settings, { fromKey: result.key, toKey: storyToLink });
                    setLastLink(storyToLink);
                } catch (e) {
                    setSubmitError(prev => (prev ? prev + ' · ' : '') + `link Story ${storyToLink} ไม่สำเร็จ: ${e.message}`);
                }
            }
        } catch (e) {
            setSubmitError(e.message);
        } finally {
            setSubmitting(false);
        }
    };

    // Clear the per-bug fields for the next entry WITHOUT a page refresh —
    // keeps project/sprint/issue-type/template field values so the next bug is fast.
    const resetForNext = () => {
        setSummary('');
        setDescription('');
        setStoryQueryTouched(false);
        setSelectedStory('');
        setStoryMatches([]);
        setLastCreated(null);
        setLastSubtask(null);
        setLastLink(null);
        setSubmitError('');
    };

    const inputCls = "w-full mt-1.5 px-3 py-2 bg-slate-50 border-2 border-slate-200 rounded-lg text-sm focus:border-amber-400 focus:ring-2 focus:ring-amber-500/20 outline-none";
    const labelCls = "text-xs font-bold text-slate-500 uppercase tracking-wider";

    const renderField = (f) => {
      const isLong = f.type === 'textarea' || (f.type === 'text' && LONG_TEXT_FIELDS.has(f.name));
      return (
        <div key={f.id} className={isLong ? 'sm:col-span-2' : ''}>
            <label className={labelCls}>{f.name} {f.required && <span className="text-rose-500">*</span>}</label>
            {f.type === 'select' && (
                <select value={fieldValues[f.id] || ''} onChange={e => setFieldValue(f.id, e.target.value)} className={inputCls}>
                    <option value="">— เลือก —</option>
                    {f.options.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                </select>
            )}
            {f.type === 'multiselect' && (
                <div className={`flex flex-wrap gap-1.5 mt-1.5 ${f.options.length > 16 ? 'max-h-40 overflow-auto p-2 border border-slate-100 rounded-lg' : ''}`}>
                    {f.options.map(o => {
                        const active = (fieldValues[f.id] || []).includes(o.id);
                        return (
                            <button key={o.id} type="button" onClick={() => toggleMultiValue(f.id, o.id)}
                                className={`py-1.5 px-2.5 rounded-lg text-xs font-bold border transition-colors ${active ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-400'}`}>
                                {o.label}
                            </button>
                        );
                    })}
                </div>
            )}
            {isLong && (
                <textarea value={fieldValues[f.id] || ''} onChange={e => setFieldValue(f.id, e.target.value)} rows={3} className={inputCls + " font-mono resize-y"} />
            )}
            {f.type === 'text' && !isLong && (
                <input type="text" value={fieldValues[f.id] || ''} onChange={e => setFieldValue(f.id, e.target.value)} className={inputCls} />
            )}
            {f.type === 'number' && (
                <input type="number" value={fieldValues[f.id] ?? ''} onChange={e => setFieldValue(f.id, e.target.value)} className={inputCls} />
            )}
            {f.type === 'date' && (
                <input type="date" value={fieldValues[f.id] || ''} onChange={e => setFieldValue(f.id, e.target.value)} className={inputCls} />
            )}
            {f.type === 'tags' && (
                <input type="text" value={fieldValues[f.id] || ''} onChange={e => setFieldValue(f.id, e.target.value)} className={inputCls} placeholder="คั่นด้วยคอมมา เช่น a, b, c" />
            )}
        </div>
      );
    };

    return (
        <div className="bg-white rounded-2xl border border-slate-100 p-5 space-y-4">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label className={labelCls}>โปรเจกต์ {isDefault && <span className="text-amber-600 normal-case">· ค่าเริ่มต้น</span>}</label>
                    <select value={projectKey} onChange={e => { setProjectKey(e.target.value); setIssuetypeId(''); setSprintId(''); setSelectedTemplate(''); }}
                        className={inputCls}>
                        <option value="">— เลือกโปรเจกต์ —</option>
                        {pinnedProjects.length > 0 && (
                            <optgroup label="📌 ปักหมุด">
                                {pinnedProjects.map(p => <option key={p.key} value={p.key}>{p.key} — {p.name}</option>)}
                            </optgroup>
                        )}
                        {pinnedProjects.length > 0
                            ? <optgroup label="ทั้งหมด">{otherProjects.map(p => <option key={p.key} value={p.key}>{p.key} — {p.name}</option>)}</optgroup>
                            : otherProjects.map(p => <option key={p.key} value={p.key}>{p.key} — {p.name}</option>)}
                    </select>
                    <div className="flex gap-2 mt-2">
                        <button type="button" onClick={togglePin} disabled={!projectKey}
                            className={`flex-1 px-2 py-1.5 rounded-lg border text-xs font-bold transition-colors disabled:opacity-40 ${isPinned ? 'border-amber-400 bg-amber-50 text-amber-700' : 'border-slate-200 text-slate-500 hover:border-amber-300 hover:text-amber-600'}`}>
                            {isPinned ? '⭐ ปักหมุดแล้ว' : '☆ ปักหมุด'}
                        </button>
                        <button type="button" onClick={makeDefault} disabled={!projectKey}
                            className={`flex-1 px-2 py-1.5 rounded-lg border text-xs font-bold transition-colors disabled:opacity-40 ${isDefault ? 'border-amber-400 bg-amber-50 text-amber-700' : 'border-slate-200 text-slate-500 hover:border-amber-300 hover:text-amber-600'}`}>
                            {isDefault ? '📌 เป็นค่าเริ่มต้น' : '📌 ตั้งเป็นค่าเริ่มต้น'}
                        </button>
                    </div>
                </div>
                <div>
                    <label className={labelCls}>Issue Type</label>
                    <select value={issuetypeId} onChange={e => setIssuetypeId(e.target.value)} disabled={!meta} className={inputCls + " disabled:opacity-50"}>
                        {!meta && <option value="">— เลือกโปรเจกต์ก่อน —</option>}
                        {meta && (meta.issueTypes || []).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                </div>
                <div className="sm:col-span-2">
                    <label className={labelCls}>Sprint {meta && !meta.sprintFieldId && <span className="text-slate-400 font-normal normal-case">(โปรเจกต์นี้ไม่มี Sprint field)</span>}</label>
                    <select value={sprintId} onChange={e => setSprintId(e.target.value)} disabled={!sprints || (meta && !meta.sprintFieldId)} className={inputCls + " disabled:opacity-50"}>
                        <option value="">{sprints ? '— Backlog (ไม่ระบุ Sprint) —' : '— กำลังโหลด Sprint... —'}</option>
                        {(sprints || []).map(s => <option key={s.id} value={s.id}>{s.name}{s.state === 'active' ? ' • active' : ''}</option>)}
                    </select>
                    {sprintError && <p className="text-[11px] text-rose-600 mt-1">{sprintError}</p>}
                </div>
                <div className="sm:col-span-2">
                    <label className={labelCls}>Template ({templateNames.length})</label>
                    <div className="flex gap-1.5 mt-1.5">
                        <select value={selectedTemplate} onChange={e => applyTemplate(e.target.value)} className="flex-grow px-3 py-2 bg-slate-50 border-2 border-slate-200 rounded-lg text-sm focus:border-amber-400 outline-none">
                            <option value="">— ไม่ใช้ Template —</option>
                            {templateNames.map(n => <option key={n} value={n}>{n}</option>)}
                        </select>
                        <button type="button" title="บันทึกเป็น Template" onClick={saveTemplate} disabled={!projectKey}
                            className="px-3 py-2 rounded-lg border border-slate-200 text-slate-500 hover:border-amber-300 hover:text-amber-600 disabled:opacity-50">
                            💾
                        </button>
                        {selectedTemplate && (
                            <button type="button" title="ลบ Template" onClick={() => deleteTemplate(selectedTemplate)}
                                className="px-3 py-2 rounded-lg border border-slate-200 text-slate-500 hover:border-rose-300 hover:text-rose-600">
                                🗑️
                            </button>
                        )}
                    </div>
                </div>
            </div>

            {metaError && <p className="text-[11px] text-rose-600 break-all bg-rose-50 border border-rose-200 rounded p-2">{metaError}</p>}
            {metaLoading && <p className="text-[11px] text-slate-400 flex items-center gap-1.5"><span className="inline-block w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"></span> กำลังดึงฟิลด์จาก Jira...</p>}

            {meta && (
                <>
                    <div className="border-t border-slate-100 pt-4">

    };

        const groups = {};

            // group by the day of MY action (activityDay); falls back to created

            (groups[day] = groups[day] || []).push(r);
